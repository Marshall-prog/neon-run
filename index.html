      // бегущие точки вдоль луча
      ctx.shadowBlur = 10; ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.85;
      for (let i = 0; i < 6; i++) {
        const f = ((ob.t * 0.55 + i / 6) % 1);
        ctx.beginPath();
        ctx.arc(x + 12 + f * (w - 24), cy, 2.2, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    },
  },
  n_arc: {
    w: 112, h: 46, hb: 0.6, fly: GY - 68, bob: 8,
    draw(ob, pal) {
      const w = ob.def.w, h = ob.def.h, x = ob.x, cy = ob.y - h / 2;
      ctx.save();
      // узлы
      nDark(0.9); nGlow(pal.neon, 12); ctx.strokeStyle = pal.neon; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(x + 8, cy, 8, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + w - 8, cy, 8, 0, 6.2832); ctx.fill(); ctx.stroke();
      // молния
      const flick = 0.55 + 0.45 * Math.sin(ob.t * 21);
      ctx.shadowBlur = 14; ctx.strokeStyle = pal.neon; ctx.lineWidth = 2.6; ctx.globalAlpha = flick;
      ctx.beginPath();
      const seg = 7;
      ctx.moveTo(x + 8, cy);
      for (let i = 1; i <= seg; i++) {
        const f = i / seg;
        const jx = (i === seg) ? 0 : (Math.sin(ob.t * 17 + i * 2.7) * 7);
        ctx.lineTo(x + 8 + f * (w - 16) + jx, cy + jx * 0.4);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    },
  },
  n_drone: {
    w: 74, h: 48, hb: 0.7, fly: GY - 72, bob: 12, move: 60,
    draw(ob, pal) {
      const w = ob.def.w, h = ob.def.h, x = ob.x, cy = ob.y - h / 2;
      ctx.save();
      // пропеллеры
      ctx.shadowBlur = 10; ctx.strokeStyle = pal.glow; ctx.lineWidth = 2; ctx.globalAlpha = 0.85;
      for (const rx of [x + 16, x + w - 16]) {
        ctx.beginPath();
        ctx.moveTo(rx - 9, cy - h / 2 + 2);
        ctx.lineTo(rx + 9, cy - h / 2 + 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // корпус
      nDark(0.9);
      nGlow(pal.neon, 13); ctx.strokeStyle = pal.neon; ctx.lineWidth = 2.4;
      nPath([[x + 14, cy - 6], [x + w - 14, cy - 6], [x + w - 6, cy + 8],
             [x + 6, cy + 8]], true);
      ctx.fill(); ctx.stroke();
      // глаз
      const p = 0.5 + 0.5 * Math.sin(ob.t * 5);
      ctx.shadowBlur = 14; ctx.fillStyle = "#ff4d6d"; ctx.globalAlpha = 0.45 + p * 0.55;
      ctx.beginPath(); ctx.arc(x + w - 18, cy, 3.4, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      // подсветка снизу
      ctx.shadowBlur = 10; ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(x + 12, cy + 9); ctx.lineTo(x + 8, cy + 15);
      ctx.moveTo(x + w - 12, cy + 9); ctx.lineTo(x + w - 8, cy + 15);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    },
  },
  n_orb: {
    w: 58, h: 58, hb: 0.65, fly: GY - 70, bob: 14,
    draw(ob, pal) {
      const w = ob.def.w, h = ob.def.h, cx = ob.x + w / 2, cy = ob.y - h / 2;
      const r = Math.min(w, h) / 2 - 3;
      const p = 0.5 + 0.5 * Math.sin(ob.t * 3.6);
      ctx.save();
      ctx.shadowBlur = 12;
      for (let i = 3; i >= 1; i--) {
        const f = i / 3;
        ctx.strokeStyle = i === 1 ? pal.neon : pal.glow;
        ctx.globalAlpha = (i === 1 ? 0.95 : 0.4) * (0.7 + p * 0.3);
        ctx.lineWidth = i === 1 ? 2.4 : 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, r * (0.45 + f * 0.55) * (0.9 + p * 0.12), 0, 6.2832);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 16; ctx.fillStyle = pal.neon; ctx.globalAlpha = 0.55 + p * 0.4;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.34, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    },
  },
  // ---------------- особые ----------------
  n_drop: {
    w: 64, h: 64, hb: 0.8, drop: true,
    draw(ob, pal) {
      const w = ob.def.w, h = ob.def.h, cx = ob.x + w / 2, y = ob.y - h;
      ctx.save();
      // трос к потолку
      ctx.shadowBlur = 6; ctx.strokeStyle = pal.glow; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx, 0); ctx.stroke();
      ctx.globalAlpha = 1;
      // блок
      nDark(0.92); nGlow(pal.neon, 14); ctx.strokeStyle = pal.neon; ctx.lineWidth = 2.5;
      roundRect(ob.x + 4, y, w - 8, h, 6); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 5; ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(ob.x + 14, y + 12); ctx.lineTo(ob.x + w - 14, y + h - 12);
      ctx.moveTo(ob.x + w - 14, y + 12); ctx.lineTo(ob.x + 14, y + h - 12);
      ctx.stroke();
      ctx.globalAlpha = 1;
      const p = 0.5 + 0.5 * Math.sin(ob.t * 6);
      ctx.shadowBlur = 14; ctx.fillStyle = "#ff4d6d"; ctx.globalAlpha = 0.35 + p * 0.6;
      ctx.beginPath(); ctx.arc(cx, y + h / 2, 4 + p * 2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    },
  },
  n_tramp: {
    w: 66, h: 28, hb: 0.72, bounce: true,
    draw(ob, pal) {
      const w = ob.def.w, h = ob.def.h, x = ob.x, y = ob.y - h;
      ctx.save();
      nDark(0.9); nGlow(pal.neon, 12); ctx.strokeStyle = pal.neon; ctx.lineWidth = 2.2;
      roundRect(x + 2, y + 6, w - 4, h - 6, 5); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 6; ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.6;
      for (let i = 0; i < 3; i++) {
        const cy2 = y + h - 9 - i * 6;
        ctx.globalAlpha = 0.9 - i * 0.25;
        ctx.beginPath();
        ctx.moveTo(x + 11, cy2); ctx.lineTo(x + w / 2, cy2 - 5); ctx.lineTo(x + w - 11, cy2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 8; ctx.strokeStyle = pal.neon; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x + 4, ob.y); ctx.lineTo(x + w - 4, ob.y); ctx.stroke();
      ctx.restore();
    },
  },
};

// ---------- falling props ----------
// A "drop" prop hangs from the ceiling, falls and slams into the ground, where
// it stays as a normal obstacle. The fall is timed so the prop always lands a
// fixed distance AHEAD of the runner (never on top of them) and so late levels
// (which scroll faster) get a proportionally quicker fall.
const DROP_AHEAD = 180;          // px in front of the runner where it lands
const DROP_T_MAX = 0.62;         // longest fall, in seconds
function dropProfile(sp) {
  const T = Math.min(DROP_T_MAX, 260 / Math.max(1, sp));
  return { T, top: GY - 0.5 * GRAVITY * T * T };
}

// ---------- jump arc (derived from the real physics) ----------
// Simulated once with the same integrator the player uses, so coins placed on
// this curve sit exactly on the flight path instead of an approximate arc.
const JUMP_ARC = (() => {
  const STEP = 1 / 60, G = 2800, V0 = -1080;
  let vy = V0, y = 0, t = 0;
  const pts = [];
  for (let i = 0; i < 600; i++) {
    let g = vy > 0 ? 1.12 : 1.0;
    if (Math.abs(vy) < 120) g = 0.65;
    vy += G * g * STEP;
    y += vy * STEP;
    t += STEP;
    if (i % 2 === 0) pts.push({ t, h: -y });      // h = height above take-off
    if (y >= 0 && t > 0.05) break;
  }
  return pts;
})();
const JUMP_ARC_SPAN = JUMP_ARC[JUMP_ARC.length - 1].t;   // seconds in the air
const JUMP_PEAK = Math.max(...JUMP_ARC.map(p => p.h));

// height of the flight path at a given fraction of the jump (0..1)
function arcHeight(f) {
  f = Math.max(0, Math.min(1, f));
  const idx = f * (JUMP_ARC.length - 1);
  const i0 = Math.floor(idx), i1 = Math.min(JUMP_ARC.length - 1, i0 + 1);
  const k = idx - i0;
  return JUMP_ARC[i0].h * (1 - k) + JUMP_ARC[i1].h * k;
}

function spawnObstacle(name, x) {
  const def = OBS[name];
  const ob = { name, def, x, t: Math.random() * 10, ext: 0 };
  if (def.drop) {
    // hangs from the ceiling, then slams into the ground and stays there
    const dp = dropProfile(speed);
    ob.dropT = dp.T; ob.dropTop = dp.top;
    ob.y = dp.top; ob.vy = 0; ob.dropState = "hang";
  }
  else if (def.fly) { ob.baseY = def.fly; ob.y = def.fly; }
  else if (def.hop) { ob.y = GY; ob.vy = 0; }
  else ob.y = GY;
  obstacles.push(ob);
  // Loot: coins laid along the jump arc, with one gem replacing a coin now and
  // then. Everything the player collects is a coin (by far the most common) or
  // a rarer gem — never a mix of unrelated pickup types.
  // A falling prop lands `speed * T` pixels to the left of where it spawned,
  // so its loot arc has to follow the landing spot.
  const arcX = def.drop ? (x - speed * ob.dropT) : x;
  if (!def.fly && !def.hop && !def.noLoot && Math.random() < 0.62) {
    const span = speed * JUMP_ARC_SPAN;              // px covered during the jump
    const apexX = arcX + def.w / 2;                     // apex over the obstacle
    const x0 = apexX - span * 0.5;                   // take-off point
    // keep a comfortable spacing so loot never clumps: at least 34 px apart,
    // and never more than fits the arc
    const spacing = Math.max(34, span * 0.14);
    const n = Math.max(3, Math.min(7, Math.floor(span * 0.8 / spacing) + 1));
    const coin = coinSprite();                       // level's coin colour
    const gem = gemSprite();
    const gemAt = (Math.random() < 0.18) ? Math.floor(Math.random() * n) : -1;
    for (let i = 0; i < n; i++) {
      const f = 0.12 + 0.76 * (i / (n - 1));         // skip the very ends
      coinsArr.push({
        kind: i === gemAt ? gem : coin,
        x: x0 + span * f,
        y: GY - 34 - arcHeight(f),                   // 34 px = player's centre height
        t: 0,
        _arc: true,
      });
    }
  }
}

function updateSpawning() {
  if (dist < spawnAt) return;
  const m = dist / PX_PER_M;
  const name = pickObstacle();
  spawnObstacle(name, W + 60);
  if (m > 1600 && !nextIsPair && Math.random() < 0.35) {
    // Иногда пара: летающее + наземное совсем рядом. Зазор считаем от ширины
    // первого препятствия: иначе широкое (например, балка 126 px) съедает его
    // целиком и игрока зажимает между двумя хитбоксами без шанса прыгнуть.
    const ground = Math.random() < 0.5 ? "n_block" : "n_spikes";
    const gap = 170 + OBS[name].w;
    spawnObstacle(ground, W + 60 + gap);
    nextIsPair = true;
  } else {
    nextIsPair = false;
  }
  const gap = 300 + Math.random() * 240 + speed * (0.55 + Math.random() * 0.55);
  spawnAt = dist + gap;
}

// ---------- particles ----------
function spawnPuff(x, y, n) {
  const pal = palette();
  for (let i = 0; i < n; i++) particles.push({
    x, y: y - 4, vx: -speed * 0.15 - Math.random() * 80, vy: -Math.random() * 90,
    life: 0.4 + Math.random() * 0.3, max: 0.7, size: 2 + Math.random() * 3, col: pal.neon,
  });
}
function spawnBurst(x, y, n) {
  const pal = palette();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 320;
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 100,
      life: 0.6 + Math.random() * 0.5, max: 1.1, size: 3 + Math.random() * 4,
      col: Math.random() < 0.5 ? pal.neon : "#ffffff",
    });
  }
}
function spawnSpark(x, y, col) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35, max: 0.35, size: 2 + Math.random() * 2, col });
  }
}

// ---------- update ----------
function update(dt) {
  bgT += dt;
  if (startPending) tickStartGate(dt);         // Play tapped: wait for music, then go
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.8);
  if (medalFlash > 0) medalFlash -= dt;
  if (recordFlash > 0) recordFlash -= dt;
  if (hintT > 0) hintT -= dt;
  if (levelBannerT > 0) levelBannerT -= dt;
  if (mood === "happy" && moodT > 0) { moodT -= dt; if (moodT <= 0) mood = "normal"; }

  if (state === ST.DEAD) {
    deadAt += dt;
    player.deadT += dt;
    // keep particles alive
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    return;
  }
  if (state !== ST.PLAY) return;

  if (hitStop > 0) { hitStop -= dt; return; }  // brief freeze on hit for impact

  // deferred tap-jump: commit if the finger is just resting (not swiping down)
  if (pendingJumpT !== null && performance.now() - pendingJumpT > 150) {
    pendingJumpT = null; tryJump();
  }

  if (duckLatch > 0) {
    duckLatch -= dt;
    if (duckLatch <= 0 && !anyPointerDown) setDuck(false);
  }
  if (slideT > 0) {
    slideT -= dt;
    if (slideT <= 0 && player.onGround) {
      player.ducking = false;
    }
  }

  playT += dt;
  dist += speed * dt;
  speed = Math.min(SPEED_MAX, SPEED0 + Math.sqrt(dist / PX_PER_M) * SPEED_SQRT);

  // new difficulty level -> announce it
  const lvl = levelIdx();
  if (lvl !== shownLevel) {
    shownLevel = lvl;
    if (lvl > 0) {
      levelBannerTxt = "Уровень " + (lvl + 1) + " • " + toTitleCase(LEVEL_NAMES[lvl]);
      levelBannerT = 2.6;
      flash = Math.max(flash, 0.45);
      Sound.medal();
      Music.setTrack(lvl);            // soundtrack follows the difficulty
    }
  }

  // player physics: the stride phase is tied to travelled distance, so the feet
  // stay planted in the world (no skating). The stride LENGTH grows strongly
  // with speed, so cadence rises gently (≈220 → 325 steps/min over the ramp)
  // instead of pinwheeling, which is what made the runner look like it was
  // sprinting on a treadmill at high levels.
  const p = player;
  const strideLen = 80 + speed * 0.28;      // ~164 px at speed 300, ~332 px at 900
  p.strideLen = strideLen;                  // exposed for tests / tuning
  p.anim = dist / strideLen;
  if (p.buffer > 0) p.buffer -= dt;
  if (p.buffer > 0 && (p.onGround || p.coyote > 0 || p.jumps < 2)) { p.buffer = 0; doJump(); }
  if (!p.onGround) {
    // asymmetric arc: hang at the apex, snappy fall
    let g = p.vy > 0 ? 1.12 : 1;
    if (Math.abs(p.vy) < 120) g = 0.65;
    if (p.ducking && p.vy > 0) g = 2.2;   // air duck = fast fall
    p.vy += GRAVITY * g * dt;
    p.coyote -= dt;
  }
  p.y += p.vy * dt;
  if (p.y >= GY) {
    if (!p.onGround) { spawnPuff(p.x, GY, 5); p.landT = 0.14; }
    p.y = GY; p.vy = 0; p.onGround = true; p.jumps = 0; p.coyote = 0.1;
  } else if (p.onGround) {
    p.onGround = false; p.coyote = 0.1;
  }
  if (p.landT > 0) p.landT -= dt;
  // run dust
  if (p.onGround && Math.random() < dt * 14) spawnPuff(p.x - 14, GY, 1);

  updateSpawning();

  // obstacles
  for (const ob of obstacles) {
    ob.x -= speed * dt;
    ob.t += dt;
    if (ob.def.bob) ob.y = ob.baseY + Math.sin(ob.t * 4) * ob.def.bob;
    if (ob.def.move) ob.x -= ob.def.move * dt;
    if (ob.def.hop) {
      ob.vy += GRAVITY * 0.55 * dt; ob.y += ob.vy * dt;
      if (ob.y >= GY) { ob.y = GY; ob.vy = -520; }
    }
    if (ob.def.drop) {
      if (ob.dropState === "hang") {
        // release it once the fall will end in front of the runner
        if (ob.x <= player.x + DROP_AHEAD + speed * ob.dropT) { ob.dropState = "fall"; ob.vy = 0; }
      } else if (ob.dropState === "fall") {
        ob.vy += GRAVITY * dt; ob.y += ob.vy * dt;
        if (ob.y >= GY) {
          ob.y = GY; ob.vy = 0; ob.dropState = "landed";
          spawnPuff(ob.x + ob.def.w / 2, GY, 12);
          shake = Math.max(shake, 5);
          Sound.thud();
        }
      }
    }
    if (ob.def.spin) ob.spin = (ob.spin || 0) + dt * 7;
    // выдвижной бур: высота хода меняется по синусу, поэтому игрок успевает
    // оценить обстановку заранее (наезд справа виден за полсекунды)
    if (ob.def.drill) ob.ext = 37 + 37 * Math.sin(ob.t * 2.2);
    // a spring punts the player upward instead of killing them
    if (ob.def.bounce && !ob.spring && !player.dead) {
      const pk2 = playerHitbox();
      const ow = ob.def.w * ob.def.hb, oh = ob.def.h * ob.def.hb;
      const ox = ob.x + (ob.def.w - ow) / 2;
      const oy = ob.y - oh;
      if (pk2.cx + pk2.w / 2 > ox && pk2.cx - pk2.w / 2 < ox + ow &&
          pk2.cy + pk2.h / 2 > oy) {
        ob.spring = true;
        player.vy = JUMP_V * 0.92; player.onGround = false; player.jumps = 1;
        Sound.jump(); spawnPuff(ob.x + ob.def.w / 2, ob.y, 8);
      }
    }
  }
  obstacles = obstacles.filter(ob => ob.x + ob.def.w > -40);

  // coins & gems
  const pk = playerHitbox();
  for (const c of coinsArr) {
    c.x -= speed * dt; c.t += dt;
    const isGem = c.kind.indexOf("gem") === 0;
    const cx = c.x, cy = c.y + Math.sin(c.t * 5) * 4;
    const rr = isGem ? 30 : 26;
    if (Math.abs(cx - pk.cx) < rr + pk.w / 2 && Math.abs(cy - pk.cy) < rr + pk.h / 2) {
      c.taken = true;
      const worth = isGem ? 10 : 1;
      coins += worth;
      if (isGem) Sound.gem(); else Sound.coin();
      mood = "happy"; moodT = 0.7;          // grin while grabbing loot
      floaties.push({ x: c.x, y: c.y, txt: "+" + worth, life: 0.8 });
      spawnSpark(c.x, c.y, isGem ? "#2bd6ff" : "#ffd21e");
    }
  }
  coinsArr = coinsArr.filter(c => !c.taken && c.x > -60);

  // collisions
  if (!p.dead) {
    for (const ob of obstacles) {
      if (ob.def.bounce) continue;             // springs launch, never kill
      if (ob.def.drop && ob.dropState !== "landed") continue;   // still in the air
      // у препятствия может быть свой хитбокс (например, у бура — только
      // выдвинутая часть), иначе берём втянутую внутрь рамки область
      let rects;
      if (ob.def.hit) rects = ob.def.hit(ob);
      else {
        const hb = ob.def.hb;
        const ow = ob.def.w * hb, oh = ob.def.h * hb;
        rects = [{ x: ob.x + (ob.def.w - ow) / 2, y: ob.y - oh, w: ow, h: oh }];
      }
      for (const r of rects) {
        if (r.h <= 0 || r.w <= 0) continue;
        if (pk.cx + pk.w / 2 > r.x && pk.cx - pk.w / 2 < r.x + r.w &&
            pk.cy + pk.h / 2 > r.y && pk.cy - pk.h / 2 < r.y + r.h) {
          die(); break;
        }
      }
      if (p.dead) break;
    }
  }

  // particles
  for (const pt of particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 700 * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  for (const f of floaties) { f.y -= 50 * dt; f.life -= dt; }
  floaties = floaties.filter(f => f.life > 0);

  // record flash while alive
  const m = Math.floor(dist / PX_PER_M);
  if (!newRecord && m > best && best > 0) {
    newRecord = true; best = m; store.set("best", best);
    recordFlash = 2; Sound.record();
  }
}

function playerHitbox() {
  const p = player;
  const duck = p.ducking && p.onGround;
  const h = duck ? 50 : 78;
  const w = duck ? 62 : 44;
  return { cx: p.x, cy: p.y - h / 2, w, h };
}

// ---------- drawing ----------
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#05060f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.setTransform(scale, 0, 0, scale, offX + sx * scale, offY + sy * scale);
  ctx.imageSmoothingEnabled = false;
  // hard-clip the logical play field: keeps shake/parallax spill from painting
  // bright specks into the letterbox margins (the white artifacts)
  ctx.beginPath();
  ctx.rect(-24, -24, W + 48, H + 48);
  ctx.clip();

  const pal = palette();

  drawBackground(pal);

  // ground
  ctx.fillStyle = "#070818";
  ctx.fillRect(-20, GY, W + 40, H - GY + 20);  ctx.strokeStyle = pal.neon; ctx.lineWidth = 3;
  ctx.shadowColor = pal.neon; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(-20, GY + 1.5); ctx.lineTo(W + 20, GY + 1.5); ctx.stroke();
  ctx.shadowBlur = 0;

  // scrolling ground grid
  ctx.strokeStyle = pal.dim; ctx.lineWidth = 1.5;
  const scroll = (dist * 1) % 60;
  for (let i = -1; i < 9; i++) {
    const y = GY + 14 + i * i * 2.6 + 10;
    if (y > H) break;
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.moveTo(-20, y); ctx.lineTo(W + 20, y); ctx.stroke();
  }
  ctx.globalAlpha = 0.5;
  const vscroll = (dist * 1.1) % 80;
  for (let i = -1; i < 8; i++) {
    const x = i * 80 - (vscroll % 80);
    ctx.beginPath(); ctx.moveTo(x, GY + 2); ctx.lineTo(x - 30, H); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // speed streaks
  if (state === ST.PLAY && speed > 380) {
    ctx.strokeStyle = pal.neon; ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const yy = 80 + ((i * 137 + bgT * 60 * speed * 0.3) % (GY - 160));
      const xx = ((i * 211 + bgT * -speed * 1.2) % (W + 200) + W + 200) % (W + 200) - 100;
      ctx.globalAlpha = 0.18;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + 60, yy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // coins
  for (const c of coinsArr) drawCoin(c, pal);

  // obstacles
  for (const ob of obstacles) drawObstacle(ob, pal);

  // player
  drawPlayer(pal);

  // particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.col;
    const s = Math.round(pt.size);
    ctx.fillRect(Math.round(pt.x - s / 2), Math.round(pt.y - s / 2), s, s);
  }
  ctx.globalAlpha = 1;

  // floating texts
  ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
  for (const f of floaties) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.fillStyle = "#ffd21e";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // flash on death
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${(flash * 0.5).toFixed(3)})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  // HUD & screens
  if (startPending) drawStartGate(pal);
  else {
    if (state === ST.PLAY) drawHUD(pal);
    if (state === ST.MENU) drawMenu(pal);
    if (state === ST.PAUSE) drawPause(pal);
    if (state === ST.DEAD) drawDead(pal);
  }
}

// The instant between tapping Play and the run starting: the world is already
// reset (runner on the ground, empty field) and the music is decoding. Showing
// this instead of the menu keeps the transition smooth and makes it obvious
// that the run is about to begin.
function drawStartGate(pal) {
  const a = 0.55 + 0.45 * Math.sin(bgT * 12);
  ctx.globalAlpha = a;
  text("ПОЕХАЛИ!", W / 2, GY - 190, 46, pal.neon, "center", true);
  ctx.globalAlpha = 1;
  text("готовим музыку…", W / 2, GY - 140, 18, "rgba(255,255,255,0.5)");
}

// ---------- background: exactly one permanent backdrop per difficulty level ----------
function drawBackground(pal) {
  const ti = levelIdx();   // 0..9, one permanent backdrop per level

  // sky
  const grad = ctx.createLinearGradient(0, 0, 0, GY);
  grad.addColorStop(0, "#05060f");
  grad.addColorStop(1, pal.dim);
  ctx.fillStyle = grad;
  ctx.fillRect(-20, -20, W + 40, GY + 20);

  // stars (parallax, twinkle)
  if (ti !== 3) {
    for (const st of stars) {
      const x = Math.round(((st.x - dist * st.z * 0.05) % (W + 40) + W + 40) % (W + 40) - 20);
      const a = 0.25 + 0.25 * Math.sin(bgT * 2 + st.tw);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
      ctx.fillRect(x, Math.round(st.y), 2, 2);
    }
  }

  switch (ti) {
    case 0: // НЕОНОВЫЙ ГОРИЗОНТ — простая неоновая линия, без бликов
      // минимальный парник: только неоновый горизонт
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = pal.neon; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-30, GY - 180);
      ctx.quadraticCurveTo(W/2, GY - 210, W + 30, GY - 180);
      ctx.stroke();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = pal.glow; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-30, GY - 178);
      ctx.quadraticCurveTo(W/2, GY - 206, W + 30, GY - 178);
      ctx.stroke();
      ctx.restore();
      drawRidge(ridgesNear, 0.6, pal.neon, "#060814", 0.9);
      break;
    case 1: // ЗАКАТНЫЙ ГОРОД — небоскрёбы с окнами
      drawSun(pal, 0.55, W * 0.5, GY - 430, 80);
      drawBuildings(cityFar, 0.12, pal.dim, pal.glow, 0.6, pal);
      drawBuildings(cityNear, 0.3, "#070818", pal.neon, 0.95, pal);
      break;
    case 2: // ЛУННЫЕ ГОРЫ — луна, облака, острый хребет
      drawMoon(pal);
      drawClouds(pal);
      drawRidge(ridgesMoon, 0.35, pal.glow, "#070818", 0.8);
      break;
    case 3: // СИНТВЕЙВ — сетка + планета с кольцом
      drawSkyGrid(pal);
      drawRingedPlanet(pal);
      drawRidge(ridgesNear, 0.5, pal.neon, "#070818", 0.75);
      break;
    case 4: // НЕОНОВЫЙ ЛЕС — деревья + большая планета
      drawPlanet(pal);
      drawTrees(treesFar, 0.12, pal.glow, "#070818", 0.65, pal);
      drawTrees(treesNear, 0.3, pal.neon, "#070818", 0.95, pal);
      break;
    case 5: // ЛЕДЯНОЙ КАНЬОН — сияние, ледяные пики, снег
      drawAurora(pal);
      drawIceSpikes(ridgesIce, 0.25, pal.glow, pal.dim, 0.55);
      drawIceSpikes(ridgesNear, 0.5, pal.neon, "#061420", 0.9);
      drawSnow(pal);
      break;
    case 6: // ВУЛКАН — дымный диск, лавовый хребет, пепел
      drawVolcano(pal);
      drawLavaRidge(ridgesLava, 0.4, pal.neon, "#180704", 0.9);
      drawAsh(pal);
      break;
    case 7: // НЕОНОВАЯ ПУСТЫНЯ — солнце, дюны, пирамиды
      drawSun(pal, 0.8, W * 0.3, GY - 360, 96);
      drawDunes(duneFar, 0.15, pal.glow, pal.dim, 0.5);
      drawPyramids(pal);
      drawDunes(ridgesDune, 0.4, pal.neon, "#241a05", 0.9);
      break;
    case 8: // ПОДЗЕМЕЛЬЕ — кристаллы, сталактиты, тьма
      drawCave(pal);
      drawCrystals(crystalsFar, 0.2, pal.glow, 0.5);
      drawCrystals(crystals, 0.45, pal.neon, 0.9);
      break;
    case 9: // ЦИФРОВОЕ ЯДРО — колонны данных, пульсирующее ядро
      drawDataRain(pal);
      drawGridFloor(pal);
      drawCore(pal);
      break;
  }
}

// ---------- new theme helpers ----------

// ЛЕДЯНОЙ КАНЬОН: vertical banner aurora
function drawAurora(pal) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 26;
  ctx.lineCap = "round";
  for (const a of aurora) {
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 20) {
      const y = a.y + Math.sin((x * 0.012) + a.ph + bgT * a.sp) * a.amp;
      if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.globalAlpha = 0.10 * a.w;
    ctx.strokeStyle = pal.neon; ctx.stroke();
    ctx.globalAlpha = 0.05 * a.w;
    ctx.strokeStyle = pal.glow; ctx.stroke();
  }
  ctx.restore();
}
function drawIceSpikes(pts, par, lineCol, fillCol, alpha) {
  const span = pts.length * 46;
  const off = (dist * par * 0.1) % span;
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * span - off;
    ctx.fillStyle = fillCol;
    ctx.strokeStyle = lineCol; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(base - 40, GY + 4);
    for (let i = 0; i < pts.length; i++) {
      const x = base + i * 46;
      ctx.lineTo(x, pts[i]);
      ctx.lineTo(x + 23, GY + 4);
    }
    ctx.lineTo(base + pts.length * 46 + 40, GY + 4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function drawSnow(pal) {
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  for (const st of stars) {
    const y = (st.y + bgT * 26 * st.z) % (GY - 40);
    const x = Math.round(((st.x - dist * st.z * 0.05) % (W + 40) + W + 40) % (W + 40) - 20);
    ctx.globalAlpha = 0.2 + st.z;
    ctx.fillRect(x, Math.round(y), 2, 2);
  }
  ctx.restore();
}

// ВУЛКАН
function drawVolcano(pal) {
  const cx = W * 0.66, cy = GY - 250;
  ctx.save();
  const vg = ctx.createRadialGradient(cx, cy, 20, cx, cy, 260);
  vg.addColorStop(0, "rgba(255,90,20,0.28)");
  vg.addColorStop(1, "transparent");
  ctx.fillStyle = vg;
  ctx.fillRect(-20, -20, W + 40, GY + 20);
  // cone
  ctx.fillStyle = "#120705";
  ctx.beginPath();
  ctx.moveTo(cx - 210, GY);
  ctx.lineTo(cx - 28, cy);
  ctx.quadraticCurveTo(cx, cy - 26, cx + 28, cy);
  ctx.lineTo(cx + 210, GY);
  ctx.closePath(); ctx.fill();
  // glowing crater + lava streaks
  ctx.strokeStyle = pal.neon; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - 26, cy + 2); ctx.lineTo(cx + 26, cy + 2); ctx.stroke();
  ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * 14, cy + 6);
    ctx.lineTo(cx + i * 42, GY);
    ctx.stroke();
  }
  ctx.restore();
}
function drawLavaRidge(pts, par, lineCol, fillCol, alpha) {
  const span = pts.length * 40;
  const off = (dist * par * 0.1) % span;
  ctx.save(); ctx.globalAlpha = alpha;
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * span - off;
    ctx.fillStyle = fillCol;
    ctx.beginPath();
    ctx.moveTo(base - 40, GY + 4);
    for (let i = 0; i < pts.length; i++) ctx.lineTo(base + i * 40, pts[i]);
    ctx.lineTo(base + pts.length * 40 + 40, GY + 4);
    ctx.closePath(); ctx.fill();
    // lava seams
    ctx.strokeStyle = lineCol; ctx.lineWidth = 2; ctx.globalAlpha = alpha * 0.55;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const x = base + i * 40;
      if (i === 0) ctx.moveTo(x, pts[i] + 4); else ctx.lineTo(x, pts[i] + 4);
    }
    ctx.stroke(); ctx.globalAlpha = alpha;
  }
  ctx.restore();
}
function drawAsh(pal) {
  ctx.save();
  for (const a of ash) {
    const y = ((a.y - bgT * 40 * a.z - dist * a.z * 0.06) % (GY + 20) + GY + 20) % (GY + 20);
    const x = ((a.x - dist * a.z * 0.04) % (W + 20) + W + 20) % (W + 20) - 10;
    ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(bgT + a.tw));
    ctx.fillStyle = Math.sin(bgT * 2 + a.tw) > 0 ? "#ff7a1a" : "#8a6a5a";
    ctx.fillRect(Math.round(x), Math.round(y), a.r, a.r);
  }
  ctx.restore();
}

// ПУСТЫНЯ
function drawDunes(pts, par, lineCol, fillCol, alpha) {
  const span = pts.length * 34;
  const off = (dist * par * 0.1) % span;
  ctx.save(); ctx.globalAlpha = alpha;
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * span - off;
    ctx.fillStyle = fillCol;
    ctx.beginPath();
    ctx.moveTo(base - 40, GY + 4);
    for (let i = 0; i < pts.length; i++) {
      const x = base + i * 34;
      ctx.quadraticCurveTo(x + 17, pts[i] - 18, x + 34, pts[i]);
    }
    ctx.lineTo(base + pts.length * 34 + 40, GY + 4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = lineCol; ctx.lineWidth = 1.5; ctx.globalAlpha = alpha * 0.7;
    ctx.beginPath();
    ctx.moveTo(base, pts[0]);
    for (let i = 0; i < pts.length; i++) {
      const x = base + i * 34;
      ctx.quadraticCurveTo(x + 17, pts[i] - 18, x + 34, pts[i]);
    }
    ctx.stroke(); ctx.globalAlpha = alpha;
  }
  ctx.restore();
}
function drawPyramids(pal) {
  const off = (dist * 0.15 * 0.1) % 900;
  ctx.save();
  ctx.globalAlpha = 0.75;
  for (let rep = -1; rep <= 1; rep++) {
    for (const [px, pw, ph] of [[120, 190, 150], [520, 130, 100], [780, 220, 180]]) {
      const x = rep * 900 - off + px;
      if (x > W + 60 || x + pw < -60) continue;
      ctx.fillStyle = "#241a05";
      ctx.beginPath();
      ctx.moveTo(x, GY);
      ctx.lineTo(x + pw / 2, GY - ph);
      ctx.lineTo(x + pw, GY);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = pal.neon; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6;
      ctx.stroke();
    }
  }
  ctx.restore();
}

// ПОДЗЕМЕЛЬЕ
function drawCave(pal) {
  ctx.save();
  // stalactites hanging from the top
  ctx.fillStyle = "#0b0409";
  ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.55;
  const span = 46 * 14, off = (dist * 0.5 * 0.1) % span;
  for (let rep = -1; rep <= 1; rep++) {
    for (let i = 0; i < 14; i++) {
      const x = rep * span - off + i * 46;
      const h = 40 + ((i * 37) % 70);
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + 22, 0); ctx.lineTo(x + 11, h);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawCrystals(g, par, col, alpha) {
  const off = (dist * par * 0.1) % g.span;
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 14;
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * g.span - off;
    for (const c of g.list) {
      const x = base + c.x;
      if (x > W + 40 || x + c.w < -40) continue;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(10,4,12,0.9)";
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, GY + 2);
      ctx.lineTo(x + c.w * 0.5 + c.lean * 30, GY - c.h);
      ctx.lineTo(x + c.w, GY + 2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}

// ЦИФРОВОЕ ЯДРО
function drawDataRain(pal) {
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (const d of dataCols) {
    const y = (d.y + bgT * d.sp) % (GY + 200);
    const x = ((d.x - dist * 0.02) % W + W) % W;
    const g = ctx.createLinearGradient(0, y - d.len, 0, y);
    g.addColorStop(0, "transparent");
    g.addColorStop(1, pal.neon);
    ctx.fillStyle = g;
    ctx.fillRect(Math.round(x), Math.round(y - d.len), 3, d.len);
    ctx.fillStyle = pal.neon;
    ctx.fillRect(Math.round(x), Math.round(y), 3, 5);
    // glyphs
    ctx.font = "10px monospace";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    for (let k = 1; k < 6; k++) ctx.fillText((k + d.sp | 0) % 2 ? "1" : "0", x + 8, y - k * 22);
  }
  ctx.restore();
}
function drawGridFloor(pal) {
  const hy = GY + 6;
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = -12; i <= 12; i++) {
    ctx.moveTo(W / 2 + i * 26, hy);
    ctx.lineTo(W / 2 + i * 220, GY + 300);
  }
  ctx.stroke();
  ctx.restore();
}
function drawCore(pal) {
  const cx = W * 0.72, cy = GY - 340, pulse = 1 + Math.sin(bgT * 2.4) * 0.08;
  ctx.save();
  const g = ctx.createRadialGradient(cx, cy, 6, cx, cy, 130 * pulse);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(0.25, pal.neon);
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, 120 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = pal.neon; ctx.lineWidth = 2;
  for (let i = 1; i <= 3; i++) {
    ctx.globalAlpha = 0.5 / i;
    ctx.beginPath(); ctx.arc(cx, cy, 60 * i * pulse, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawSun(pal, alpha, sunX, sunY, r) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const sg = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, r);
  sg.addColorStop(0, pal.neon); sg.addColorStop(1, "transparent");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sunX, sunY, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pal.glow;
  ctx.beginPath(); ctx.arc(sunX, sunY, r * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBuildings(b, par, fillCol, lineCol, alpha, pal, dimWin) {
  const off = (dist * par * 0.1) % b.span;
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * b.span - off;
    for (const bl of b.list) {
      const x = base + bl.x;
      if (x > W + 10 || x + bl.w < -10) continue;
      ctx.fillStyle = fillCol;
      ctx.fillRect(x, GY - bl.h, bl.w, bl.h);
      ctx.strokeStyle = lineCol; ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 0.75, GY - bl.h + 0.75, bl.w - 1.5, bl.h - 1.5);
      // lit windows (deterministic per building)
      let s = bl.seed || 1;
      const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      const chance = dimWin ? 0.16 : 0.4;
      ctx.fillStyle = pal.neon;
      for (let wy = GY - bl.h + 9; wy < GY - 16; wy += 15) {
        for (let wx = x + 7; wx < x + bl.w - 9; wx += 13) {
          if (rnd() < chance) {
            ctx.globalAlpha = alpha * (0.3 + rnd() * 0.55);
            ctx.fillRect(wx, wy, 5, 7);
          }
        }
      }
      ctx.globalAlpha = alpha;
    }
  }
  ctx.restore();
}

function drawTrees(t, par, lineCol, fillCol, alpha) {
  const off = (dist * par * 0.1) % t.span;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 2;
  ctx.shadowColor = lineCol; ctx.shadowBlur = 8;
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * t.span - off;
    for (const tr of t.list) {
      const x = base + tr.x;
      if (x > W + 20 || x + tr.w < -20) continue;
      ctx.beginPath();
      ctx.moveTo(x, GY + 2);
      ctx.lineTo(x + tr.w / 2, GY - tr.h);
      ctx.lineTo(x + tr.w, GY + 2);
      ctx.closePath();
      ctx.fillStyle = fillCol; ctx.fill();
      ctx.strokeStyle = lineCol; ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMoon(pal) {
  const mx = W * 0.68, my = GY - 380, r = 86;
  ctx.save();
  const mg = ctx.createRadialGradient(mx, my, 8, mx, my, r + 40);
  mg.addColorStop(0, "rgba(255,255,255,0.35)"); mg.addColorStop(1, "transparent");
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, r + 40, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pal.glow;
  ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
  // crescent cut
  ctx.fillStyle = "#05060f";
  ctx.globalAlpha = 0.92;
  ctx.beginPath(); ctx.arc(mx - 34, my - 16, r * 0.88, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawClouds(pal) {
  ctx.save();
  for (const c of clouds) {
    const span = 1400;
    const x = ((c.x - dist * c.z * 0.1) % span + span) % span - 200;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.strokeStyle = pal.glow;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, c.y, c.w * 0.5, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(x + c.w * 0.3, c.y - 10, c.w * 0.3, 13, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawSkyGrid(pal) {
  ctx.save();
  ctx.strokeStyle = pal.glow;
  ctx.lineWidth = 1.5;
  const hy = GY - 170;
  // perspective fan from vanishing point
  ctx.globalAlpha = 0.3;
  for (let i = -7; i <= 7; i++) {
    ctx.beginPath();
    ctx.moveTo(W / 2, hy);
    ctx.lineTo(W / 2 + i * 120, GY);
    ctx.stroke();
  }
  // horizontal lines flowing toward the viewer
  const off = (dist * 0.5) % 26;
  ctx.globalAlpha = 0.45;
  for (let k = 1; k < 13; k++) {
    const y = hy + k * k * 2.2 + off * (k / 6);
    if (y >= GY) break;
    ctx.beginPath(); ctx.moveTo(-20, y); ctx.lineTo(W + 20, y); ctx.stroke();
  }
  ctx.restore();
}

function drawRingedPlanet(pal) {
  const cx = W * 0.3, cy = GY - 400, r = 74;
  ctx.save();
  const pg = ctx.createRadialGradient(cx - 20, cy - 20, 6, cx, cy, r);
  pg.addColorStop(0, pal.neon); pg.addColorStop(1, pal.glow);
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = pal.neon; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(cx, cy, r + 46, 24, -0.42, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawPlanet(pal) {
  const cx = W * 0.7, cy = GY - 430, r = 96;
  ctx.save();
  const pg = ctx.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, r);
  pg.addColorStop(0, pal.glow); pg.addColorStop(1, "transparent");
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = pal.neon; ctx.lineWidth = 2;
  ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#05060f"; ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.arc(cx - 28, cy - 22, 22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 34, cy + 18, 15, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Ridges scroll with a wide, seamlessly repeating span — exactly like the
// building/tree/dune layers. The previous version shifted one short polyline by
// a modulo of only W/(n-1) pixels, so the silhouette visibly jumped/repeated
// every ~32 px and read as the backdrop "drifting by itself" (level 1).
//
// The silhouette is built as ONE continuous path across all repetitions and
// filled once. Filling several large shadowed polygons per frame could flash
// black on mobile GPUs (large shadowBlur fills are unreliable there), so the
// glow is applied only to the thin top edge, and only one fill happens.
function drawRidge(pts, par, lineCol, fillCol, alpha, span) {
  span = span || pts.length * RIDGE_PITCH;      // one full period of the ridge
  const off = (dist * par * 0.1) % span;
  const n = pts.length;

  // one seamless bottom-to-top silhouette: walk left→right over three periods
  ctx.save();
  ctx.globalAlpha = alpha;

  // 1) solid fill (no shadow — cheap and flicker-free)
  ctx.beginPath();
  ctx.moveTo(-span - off - 40, GY + 4);
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * span - off;
    for (let i = 0; i < n; i++) ctx.lineTo(base + i * RIDGE_PITCH, pts[i]);
  }
  ctx.lineTo(span - off + (n - 1) * RIDGE_PITCH + 40, GY + 4);
  ctx.closePath();
  ctx.fillStyle = fillCol;
  ctx.fill();

  // 2) neon top edge with the glow
  ctx.beginPath();
  for (let rep = -1; rep <= 1; rep++) {
    const base = rep * span - off;
    for (let i = 0; i < n; i++) {
      const x = base + i * RIDGE_PITCH;
      if (i === 0) ctx.moveTo(x, pts[i]); else ctx.lineTo(x, pts[i]);
    }
  }
  ctx.strokeStyle = lineCol; ctx.lineWidth = 2;
  ctx.shadowColor = lineCol; ctx.shadowBlur = 8;
  ctx.stroke();

  ctx.restore();
}

function drawSprite(name, cx, bottomY, targetH) {
  const s = SPR[name];
  if (!s) { // fallback: neon rect
    ctx.fillStyle = palette().neon;
    ctx.fillRect(cx - 20, bottomY - 40, 40, 40);
    return;
  }
  const k = targetH / s.h;
  const w = s.w * k, h = targetH;
  ctx.drawImage(s.img, Math.round(cx - w / 2), Math.round(bottomY - h), Math.round(w), Math.round(h));
}

// ---------- procedural character ----------
// We assemble the runner from loose Kenney body parts and drive the joints with
// sine phase, so arms and legs actually swing instead of two flat frames
// alternating. Everything is expressed relative to the feet at (0, 0) and the
// character facing right.

// Character metrics, tuned to match the proportions of the original 60x96 px
// Kenney pose (head ~34, torso ~30x38, legs ~32 incl. the boot, arms slim).
// Limbs take explicit WIDTH and HEIGHT so a nearly-square boot sprite is never
// stretched into a fat blob (which is what made the old runner look deformed).
// Какая модель героя рисуется: "neon" (game/hero.js) или старая спрайтовая
// склейка Кенни. Переключается через window.__heroStyle для отката.
function heroModel() {
  return window.__heroStyle || "neon";
}
// "#rrggbb" + alpha -> rgba(), для свечения/теней
function hexRGBA(h, a) {
  const n = parseInt(h.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

const CH = {
  scale: 1.0,
  legH: 34,           // thigh + shin + boot, hip down to the sole
  legW: 11,           // slim leg width
  bootH: 14,          // the l_leg boot sprite, at its own aspect
  legSwing: 0.62,     // max leg swing angle (radians)
  armH: 30,           // whole arm length
  armW: 9,            // slim arm width
  handH: 11,          // hand at the end of the arm
  bodyW: 30,          // torso
  bodyH: 34,
  headH: 42,          // drawn head height (the sprite is 48x58 incl. neck)
  headGap: 3,         // neck gap between head bottom and shoulder
};

// Foot reach: when a leg rectangle of h×w is rotated by `ang`, its lowest corner
// sinks by h*cos(ang) + w*sin(|ang|). Using the true corner keeps the sole
// planted on the ground at every phase instead of floating or clipping through.
function legDrop(legH, legW, ang) {
  return legH * Math.cos(ang) + legW * Math.sin(Math.abs(ang));
}

// draw one limb: pivot at its top, rotated by `ang`, extending downward.
// The sprite keeps its own aspect ratio — `h` is the drawn height and the width
// follows, so limbs never look squashed or stretched.
function drawLimb(name, px, py, ang, h, scale, ax) {
  const s = SPR[name];
  if (!s) return;
  const k = (scale || 1);
  const hh = h * k;
  const ww = s.w / s.h * hh;               // keep the sprite's proportions
  const pxn = (ax === undefined ? 0.5 : ax) * ww;   // horizontal pivot inside sprite
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang || 0);
  ctx.drawImage(s.img, Math.round(-pxn), 0, Math.round(ww), Math.round(hh));
  ctx.restore();
}

// A limb drawn with an explicit width, pivoting at its top. Used for arms so
// they stay slim instead of inheriting the source sprite's stretched width.
function drawLimbW(name, px, py, ang, w, h, pivot) {
  const s = SPR[name];
  if (!s) return;
  const pxn = (pivot === undefined ? 0.5 : pivot) * w;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang || 0);
  ctx.drawImage(s.img, Math.round(-pxn), 0, Math.round(w), Math.round(h));
  ctx.restore();
}

// A whole leg = a slim thigh/shin column plus the boot sprite at the sole. The
// column is drawn as a rounded capsule in the character's trouser colour so it
// reads as a limb rather than a fat rectangle.
function drawLeg(px, py, ang, len, lift) {
  const boot = SPR["l_leg"];
  const bootH = CH.bootH * (1 - lift * 0.35);
  const bootW = boot ? boot.w / boot.h * bootH : 12;
  const thighH = Math.max(2, len - bootH * 0.6);   // boot overlaps the shin a little
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang || 0);
  ctx.fillStyle = "#b8824d";                       // trouser brown, matches the boot upper
  ctx.strokeStyle = "rgba(0,0,0,0.28)";
  ctx.lineWidth = 1;
  const lw = CH.legW;
  roundRect(-lw / 2, 0, lw, thighH, lw / 2);
  ctx.fill(); ctx.stroke();
  // boot at the sole
  if (boot) ctx.drawImage(boot.img, Math.round(-bootW / 2), Math.round(thighH - bootH * 0.4), Math.round(bootW), Math.round(bootH));
  ctx.restore();
}

function drawBody(name, cx, cy, w, h) {
  const s = SPR[name];
  if (!s) return;
  ctx.drawImage(s.img, Math.round(cx - w / 2), Math.round(cy - h / 2), Math.round(w), Math.round(h));
}

// face: which expression to show, driven by mood
let mood = "normal";          // normal | happy | sad
let moodT = 0;                // happy flash timer after picking up loot

function headSprite() {
  if (player.dead || mood === "sad") return "l_head_hurt";
  if (mood === "happy") return "l_head_focus";
  return "l_head";
}

// Пропорции неоновой модели героя (мировые px): общий источник для игры и
// меню, чтобы там и там был один и тот же персонаж. Высота ~78 px, как хитбокс.
const HN = { legH: 32, legW: 9.5, bodyW: 27, bodyH: 25, armH: 26, armW: 7.5, headR: 10.5 };

// Рисует героя в текущем трансформе (ноги на y=0). Цветные элементы — всегда
// в цвете уровня: акцент и свечение берутся из палитры, никаких случайных
// переключений по настроению/смерти.
function neonHero(P, pal) {
  window.NeonHero.draw(ctx, "hoodie", Object.assign({}, HN, {
    accent: pal.neon,
    glowCol: hexRGBA(pal.neon, 0.55),
    scarfCol: "rgba(242,254,255,0.95)",
    t: bgT,
    speed: 0.8,
  }, P));
}

function drawPlayer(pal) {
  const p = player;
  const duck = p.ducking && p.onGround && !p.dead;
  const airDuck = p.ducking && !p.onGround && !p.dead;
  const running = !p.dead && p.onGround && !duck;

  // camera inertia
  const vyN = p.vy / 900;
  if (p.onGround && !lastOnGround && !p.dead) {
    camTY += 14;
    // landing dust
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 0.4) + (Math.random() - 0.5) * 0.6;
      const v = 40 + Math.random() * 60;
      particles.push({ x: p.x + (Math.random() - 0.5) * 18, y: GY, vx: Math.cos(a) * v - speed * 0.1, vy: Math.sin(a) * -v * 0.6, life: 0.25 + Math.random() * 0.2, max: 0.35, size: 2 + Math.random() * 2, col: pal.neon });
    }
  }
  lastOnGround = p.onGround;
  camTX = Math.max(-6, Math.min(6, vyN * 4.5));
  camTY = Math.max(-14, Math.min(20, (p.landT > 0 ? p.landT / 0.18 * 12 : 0) + (p.onGround ? 0 : vyN * -8)));
  camX += (camTX - camX) * 0.18;
  camY += (camTY - camY) * 0.16;

  // ------- gait phase (locked to travelled distance) -------
  const stride = p.anim;
  const ph = (stride % 1) * Math.PI * 2;

  // ------- pose parameters -------
  let bobY = 0, lean = 0, sx = 1, sy = 1;
  let legA = 0, legB = 0, armA = 0, armB = 0;
  let legLiftA = 0, legLiftB = 0;
  let crouch = 0, tuck = 0;

  if (p.dead) {
    lean = Math.min(p.deadT * 3.0, 1.35);
    armA = -1.2; armB = -1.5;
    legA = 0.5; legB = -0.4;
    sx = 1.06; sy = 0.94;
  } else if (duck) {
    crouch = 1;
    const w = Math.sin(bgT * 6) * 0.06;
    legA = 0.55 + w; legB = -0.55 + w;
    armA = 0.9; armB = -0.6;
    sx = 1.09; sy = 0.86;
    lean = 0.09;
  } else if (airDuck) {
    lean = -0.28; tuck = 1;
    legA = 0.5; legB = -0.3; armA = -1.5; armB = -1.0;
    sx = 0.93; sy = 1.09;
  } else if (!p.onGround) {
    // rise vs fall: arms/legs tuck on the way up, extend on the way down
    const up = p.vy < 0;
    const v = p.vy / 900;
    lean = Math.max(-0.36, Math.min(0.36, v)) * 0.18;
    const t = Math.min(1, Math.abs(p.vy) / 1100);
    if (up) { legA = 0.7; legB = -0.5; armA = -0.9; armB = -1.4; sx = 0.91; sy = 1.15 - t * 0.04; }
    else    { legA = -0.35; legB = 0.45; armA = 0.5; armB = 0.9; sx = 0.95; sy = 1.10 - t * 0.07; }
  } else {
    // ---- run cycle ----
    const s1 = Math.sin(ph);
    const s2 = Math.sin(ph + Math.PI);

    legA = s1 * CH.legSwing;
    legB = s2 * CH.legSwing;

    legLiftA = Math.max(0, -Math.cos(ph)) * 0.55;
    legLiftB = Math.max(0, -Math.cos(ph + Math.PI)) * 0.55;

    const lag = ph - 0.6;
    armA = Math.sin(lag + Math.PI) * 0.72;
    armB = Math.sin(lag) * 0.72;

    bobY = -Math.abs(Math.sin(ph)) * 3.0;
    lean = -0.09 - Math.sin(ph * 2) * 0.035;
    if (p.landT > 0) {
      const k = Math.min(1, p.landT / 0.18);
      const ease = k < 1 ? (1 - Math.pow(1 - k, 3)) : 1;
      sy = 1 - (0.20 * ease) * (1 - ease * 0.35);
      sx = 1 + (0.17 * ease) * (1 - ease * 0.35);
      lean += 0.07 * (1 - ease);
      bobY -= 1.9 * (1 - ease);
    }
  }
  // crouch shortens the body
  const crouchK = crouch;                 // 0..1

  // ---- vertical layout, anchored to the ground ----
  // The whole leg (thigh column + boot) spans legH; the hip sits exactly one
  // leg-length above the sole of the planted leg so the foot touches the ground.
  const legH = CH.legH * (1 - crouchK * 0.26);
  const armH = CH.armH * (1 - crouchK * 0.10);
  const bodyH = CH.bodyH * (1 - crouchK * 0.20);
  const bodyW = CH.bodyW;
  const headH = CH.headH * (1 - crouchK * 0.12);

  // the deepest-hanging leg determines how far the hip must rise so that the
  // planted foot still reaches the ground (legs are drawn from the hip down)
  const legW = CH.legW;
  const dropA = legDrop(legH, legW, legA) * (1 - legLiftA * 0.5);
  const dropB = legDrop(legH, legW, legB) * (1 - legLiftB * 0.5);
  const planted = Math.max(dropA, dropB);
  const hipY = -planted;                  // hip height above the ground line

  // which sprite pose this frame is — logged for the render tests, and used
  // below to pick the mood/face; set before any branch so both hero models
  // report the same thing.
  window.__lastPose = p.dead ? "p_hurt" : duck ? "p_duck" : airDuck ? "p_slide"
                    : !p.onGround ? (p.vy < 0 ? "p_jump" : "p_fall")
                    : (Math.floor(stride) % 2 === 0 ? "p_run1" : "p_run2");

  ctx.save();
  ctx.shadowColor = pal.neon; ctx.shadowBlur = 18;
  window.__pose = { legA, legB, armA, armB, lean, bobY, crouch, ph, legLiftA, legLiftB, hipY, legH };

  // feet-origin transform: y=0 is the ground line, everything is built upward
  ctx.translate(p.x + camX, p.y + bobY + camY);
  ctx.rotate(lean * 0.8 + camX * 0.0012);
  ctx.scale(sx, sy);

  // ---- неоновая модель героя (game/hero.js) ----
  // Тот же скелет и те же углы, что у спрайтовой склейки, но тело собрано из
  // капсул: бедро+голень на IK, плечо+предплечье, тёмный силуэт и горячий
  // контур — как у препятствий. Спрайтовая версия остаётся для отката:
  //   window.__heroStyle = "kenney"
  if (heroModel() === "neon" && window.NeonHero) {
    const hLegH = HN.legH * (1 - crouchK * 0.26);
    const hLegW = HN.legW;
    const hDropA = legDrop(hLegH, hLegW, legA) * (1 - legLiftA * 0.5);
    const hDropB = legDrop(hLegH, hLegW, legB) * (1 - legLiftB * 0.5);
    neonHero({
      hipY: -Math.max(hDropA, hDropB),
      legH: hLegH, legW: hLegW,
      bodyH: HN.bodyH * (1 - crouchK * 0.20),
      armH: HN.armH * (1 - crouchK * 0.10),
      headR: HN.headR * (1 - crouchK * 0.10),
      legA, legB, legLiftA, legLiftB, armA, armB,
      speed: Math.min(1.6, 0.55 + speed / 900),
    }, pal);
    ctx.restore();
    return;
  }

  const shoY = hipY - bodyH * 0.92;       // shoulder line above the hip

  // ---- shadow under hero ----
  if (!p.dead) {
    ctx.save();
    const shScale = 1 - (crouchK * 0.38) - (duck ? 0 : Math.max(0, Math.abs(p.vy) / 2000) * 0.08);
    const shAlpha = (0.16 + Math.abs(p.vy) * 0.00006) * (1 - crouchK * 0.6);
    ctx.globalAlpha = Math.max(0.06, Math.min(0.20, shAlpha));
    ctx.fillStyle = pal.neon;
    ctx.beginPath();
    ctx.ellipse(0, 4, 16 * shScale * sx, 4.0 * shScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---- back arm (behind the torso) ----
  drawLimbW("l_arm", -3, shoY + bodyH * 0.24, armB, CH.armW, armH, 0.5);
  // ---- legs (hip pivot, hanging down) ----
  drawLeg(-5, hipY, legA, legH * (1 - legLiftA * 0.5), legLiftA);
  drawLeg( 5, hipY - legLiftB * 4, legB, legH * (1 - legLiftB * 0.5), legLiftB);
  // ---- torso ----
  drawBody("l_body", 0, hipY - bodyH * 0.44, bodyW, bodyH);
  // ---- front arm ----
  drawLimbW("l_arm", 3, shoY + bodyH * 0.24, armA, CH.armW * 1.1, armH, 0.5);
  // ---- head ----
  {
    const hs = SPR[headSprite()];
    if (hs) {
      const hh = headH, hw = hs.w / hs.h * hh;
      const hy = shoY - hh * 0.38 - CH.headGap;
      ctx.save();
      if (p.dead) ctx.rotate(Math.sin(p.deadT * 8) * 0.1);
      ctx.drawImage(hs.img, Math.round(-hw / 2), Math.round(hy - hh / 2), Math.round(hw), Math.round(hh));
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawObstacle(ob, pal) {
  const d = ob.def;
  // свои цвета: контраст к фону важнее, чем совпадение с палитрой уровня
  if (d.draw) { d.draw(ob, hazardPalette()); return; }   // неоновое препятствие
  ctx.save();
  ctx.shadowColor = pal.neon; ctx.shadowBlur = 10;
  const cx = ob.x + d.w / 2;
  if (d.spin) {
    ctx.translate(cx, ob.y - d.h / 2);
    ctx.rotate(ob.spin || 0);
    drawSprite(d.spr, 0, d.h / 2, d.h);
  } else {
    drawSprite(d.spr, cx, ob.y, d.h);
  }
  ctx.restore();
}

function drawCoin(c, pal) {
  const y = c.y + Math.sin(c.t * 5) * 4;
  const k = c.kind || "coin";
  const isGem = k.indexOf("gem") === 0;
  const glow = isGem ? (k === "gem_red" ? "#ff4d6d" : k === "gem_yellow" ? "#ffd24a"
                      : k === "gem_green" ? "#7cff5a" : "#2bd6ff")
             : k === "coin_silver" ? "#d8e6ff"
             : k === "coin_bronze" ? "#e0a86a"
             : "#ffd21e";
  ctx.save();
  ctx.shadowColor = glow;
  ctx.shadowBlur = isGem ? 18 : 12;
  if (SPR[k]) {
    const targetH = isGem ? 36 : 34;
    drawSprite(k, c.x, y + targetH / 2, targetH);
  }
  ctx.restore();
}

function text(txt, x, y, size, col, align, glow) {
  ctx.font = `bold ${size}px sans-serif`;
  ctx.textAlign = align || "center";
  ctx.fillStyle = col;
  if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
  ctx.fillText(txt, x, y);
  ctx.shadowBlur = 0;
}

// A small drawn coin icon (no emoji font dependency). `x` is the LEFT edge and
// `y` the vertical centre; returns the width consumed so text can follow.
function coinIcon(x, y, r) {
  ctx.save();
  ctx.shadowColor = "#ffd21e"; ctx.shadowBlur = 10;
  ctx.fillStyle = "#ffd21e";
  ctx.beginPath(); ctx.arc(x + r, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(120,80,0,0.55)";
  ctx.beginPath(); ctx.arc(x + r, y, r * 0.55, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  return r * 2;
}

function toTitleCase(s) {
  if (!s) return s;
  return s.toLowerCase().replace(/(^|\s|\-|\(|\[|\/)([a-zа-яё])/g, (m, sep, ch) => sep + ch.toUpperCase());
}
function coinCount(x, y, size, count, col, glow) {
  const label = String(count);
  ctx.font = `bold ${size}px sans-serif`;
  const tw = ctx.measureText(label).width;
  const r = size * 0.42;
  const total = r * 2 + 6 + tw;
  const left = x - total;
  coinIcon(left, y - size * 0.30, r);
  text(label, x, y, size, col, "right", glow);
}
// draw the coin icon + count centred horizontally around x (used on the
// death screen, where the row must not collide with the record text)
function coinRowCentered(cx, y, size, count, col, glow) {
  const label = String(count);
  ctx.font = `bold ${size}px sans-serif`;
  const tw = ctx.measureText(label).width;
  const r = size * 0.42;
  const total = r * 2 + 6 + tw;
  const left = cx - total / 2;
  coinIcon(left, y - size * 0.30, r);
  text(label, left + r * 2 + 6, y, size, col, "left", glow);
}

function drawHUD(pal) {
  const m = Math.floor(dist / PX_PER_M);
  text(m + " м", 24, 52, 34, pal.neon, "left", true);
  text("Рекорд " + best, 24, 82, 18, "rgba(255,255,255,0.8)", "left", true);
  // level badge + progress to the next difficulty
  const lvl = levelIdx();
  text("Уровень " + (lvl + 1) + " • " + toTitleCase(LEVEL_NAMES[lvl]), 24, 112, 15, "rgba(255,255,255,0.7)", "left");
  if (lvl < DIFF_MAX) {
    const inLvl = (dist / PX_PER_M) % DIFF_LEN;
    const pct = inLvl / DIFF_LEN;
    const bx = 24, by = 124, bw = 150, bh = 4;
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = pal.neon;
    ctx.fillRect(bx, by, bw * pct, bh);
  }
  coinCount(W - 24, 116, 22, coins, "#ffd21e", true);
  // pause button
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  roundRect(W - 62, 16, 46, 46, 10); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(W - 48, 28, 6, 22); ctx.fillRect(W - 36, 28, 6, 22);
  // sound button removed from in-game HUD (only in menu now)
  // record flash
  if (recordFlash > 0 && state === ST.PLAY && !newRecord) {}
  if (recordFlash > 0 && state === ST.PLAY) {
    const a = Math.min(1, recordFlash);
    ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(bgT * 12));
    text("НОВЫЙ РЕКОРД!", W / 2, 160, 30, "#ffd21e", "center", true);
    ctx.globalAlpha = 1;
  }
  // record flash
  if (recordFlash > 0 && state === ST.PLAY && !newRecord) {}
  if (recordFlash > 0 && state === ST.PLAY) {
    const a = Math.min(1, recordFlash);
    ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(bgT * 12));
    text("НОВЫЙ РЕКОРД!", W / 2, 160, 30, "#ffd21e", "center", true);
    ctx.globalAlpha = 1;
  }
  // first-run hint
  if (firstRun && state === ST.PLAY) {
    ctx.globalAlpha = 0.85;
    text("тап снизу — прыжок", W / 2, H * 0.55, 22, "#fff");
    text("тап сверху / свайп вниз — приседание", W / 2, H * 0.55 + 30, 18, "rgba(255,255,255,0.7)");
    ctx.globalAlpha = 1;
  }
  // new difficulty level banner
  if (levelBannerT > 0) {
    const a = Math.min(1, levelBannerT / 0.5) * Math.min(1, (2.6 - levelBannerT) / 0.3);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = "rgba(5,6,15,0.55)";
    ctx.fillRect(-20, H * 0.34, W + 40, 86);
    text("Уровень " + (shownLevel + 1) + " • " + toTitleCase(LEVEL_NAMES[shownLevel] || ""), W / 2, H * 0.34 + 38, 26, pal.neon, "center", true);
    text(toTitleCase(LEVEL_NAMES[shownLevel] || ""), W / 2, H * 0.34 + 68, 20, "#fff", "center", true);
    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawMedals(y) {
  const mask = store.get("medals", 0);
  const cols = ["#cd7f32", "#c0c0c0", "#ffd700", "#9fe8ff", "#7cff5a",
                "#bfe6ff", "#ff7a1a", "#ffd24a", "#ff4d6d", "#e8ff3a"];
  const n = MEDALS.length;                 // 10 medals
  const perRow = 5;
  const R = 16;                            // medal radius
  const colGap = 84;                       // horizontal pitch (2R + 52 gutter)
  const rowGap = 64;                       // vertical pitch (2R + 32 gutter)
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / perRow), c = i % perRow;
    const inRow = Math.min(perRow, n - r * perRow);
    const x = W / 2 - (inRow - 1) * colGap / 2 + c * colGap;
    const cy = y + r * rowGap;
    const earned = mask & (1 << i);
    ctx.save();
    ctx.globalAlpha = earned ? 1 : 0.22;
    if (earned) { ctx.shadowColor = cols[i]; ctx.shadowBlur = 10; }
    ctx.fillStyle = cols[i];
    ctx.beginPath(); ctx.arc(x, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#05060f";
    ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(MEDALS[i] / 1000 + "k", x, cy + 4);
    ctx.restore();
  }
}

function drawButton(b, pal) {
  const hot = hoverId === b.id;
  ctx.save();
  ctx.fillStyle = hot ? "rgba(255,255,255,0.14)" : "rgba(255,255,255,0.05)";
  ctx.strokeStyle = hot ? "#fff" : pal.neon;
  ctx.lineWidth = hot ? 3 : 2;
  ctx.shadowColor = pal.neon; ctx.shadowBlur = hot ? 22 : 10;
  const r = 12;
  ctx.beginPath();
  ctx.moveTo(b.x + r, b.y);
  ctx.arcTo(b.x + b.w, b.y, b.x + b.w, b.y + b.h, r);
  ctx.arcTo(b.x + b.w, b.y + b.h, b.x, b.y + b.h, r);
  ctx.arcTo(b.x, b.y + b.h, b.x, b.y, r);
  ctx.arcTo(b.x, b.y, b.x + b.w, b.y, r);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  // Fit the label inside the button: measure and shrink until it fits with
  // padding, so long labels never overflow on narrow desktop/phone buttons.
  const pad = 14;
  let size = b.h * 0.46;
  ctx.font = `bold ${size}px sans-serif`;
  const maxW = b.w - pad * 2;
  let tw = ctx.measureText(b.label).width;
  if (tw > maxW) {
    size = Math.max(11, size * (maxW / tw));
    ctx.font = `bold ${size}px sans-serif`;
  }
  text(b.label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size,
       hot ? "#fff" : "rgba(255,255,255,0.9)", "center", hot);
  ctx.restore();
}

function drawButtons(pal) {
  for (const b of menuButtons()) drawButton(b, pal);
}

function drawMenu(pal) {
  const bounce = Math.sin(bgT * 2.2) * 3;

  if (menuPage === "board") {

    drawButtons(pal);

  if (menuPage === "howto") {
    ctx.fillStyle = "rgba(5,6,15,0.9)";

    text("КАК ИГРАТЬ", W / 2, 120, 34, pal.neon, "center", true);
    drawHowToPage(pal);
    drawButtons(pal);

  ctx.fillStyle = "rgba(5,6,15,0.55)";
  ctx.fillRect(-20, -20, W + 40, H + 40);
  text("NEON RUN", W / 2, 110, 56, pal.neon, "center", true);
  // hero + record sit in the gap above the button block
  {
    // та же неоновая модель, что в игре: стоит, дышит, шарф колышется
    const br = Math.sin(bgT * 1.7) * 1.4;
    const la = 0.10 + Math.sin(bgT * 1.7) * 0.015;
    const lb = -0.09 - Math.sin(bgT * 1.7) * 0.015;
    ctx.save();
    ctx.translate(W / 2 - 66, 252 + bounce + br);
    ctx.scale(1.33, 1.33);
    neonHero({
      hipY: -Math.max(legDrop(HN.legH, HN.legW, la), legDrop(HN.legH, HN.legW, lb)),
      legH: HN.legH, legA: la, legB: lb,
      legLiftA: 0.04, legLiftB: 0.02,
      armA: 0.16 + Math.sin(bgT * 1.7) * 0.05, armB: -0.12,
      speed: 0.5,
    }, pal);
    ctx.restore();
  }
  text("рекорд", W / 2 + 54, 214, 18, "rgba(255,255,255,0.55)");
  text(best + " м", W / 2 + 54, 250, 30, "#ffd21e", "center", true);
  drawButtons(pal);
  text("тап/↑/пробел — прыжок   •   свайп вниз — подкат/скольжение", W / 2, H - 20, 13, "rgba(255,255,255,0.45)");
}

function drawBoardPage(pal) {
  const list = Board.load();
  if (!list.length) {
    text("пока пусто — стань первым!", W / 2, 300, 22, "rgba(255,255,255,0.6)");
  } else {
    const x0 = W / 2 - 210, y0 = 172, rh = 50;
    list.forEach((e, i) => {
      const y = y0 + i * rh;
      const me = i + 1 === boardRank;
      ctx.save();
      ctx.fillStyle = me ? "rgba(255,210,30,0.14)" : "rgba(255,255,255,0.04)";
      ctx.strokeStyle = me ? "#ffd21e" : "rgba(255,255,255,0.12)";
      ctx.lineWidth = me ? 2 : 1;
      ctx.beginPath(); roundRect(x0, y, 420, rh - 8, 8); ctx.fill(); ctx.stroke();
      ctx.restore();
      text((i + 1) + ".", x0 + 26, y + 28, 22, me ? "#ffd21e" : "rgba(255,255,255,0.5)", "center");
      text(e.m + " м", x0 + 130, y + 29, 23, me ? "#ffd21e" : "#fff", "left", me);
      text("lvl " + (e.lv || 1), x0 + 336, y + 29, 19, "rgba(255,255,255,0.5)", "left");
      ctx.save();
      ctx.translate(x0 + 250, y + 19);
      coinIcon(0, 0, 9);
      ctx.restore();
      text(String(e.c || 0), x0 + 268, y + 29, 19, "rgba(255,255,255,0.7)", "left");
    });
  }
  text("сохраняется на этом устройстве", W / 2, 452, 14, "rgba(255,255,255,0.35)");
}

function drawHowToPage(pal) {
  // только короткое и точное описание механик — одна строка на пункт
  const lines = [
    ["Прыжок", "тап или свайп вверх"],
    ["Двойной прыжок", "тап в воздухе"],
    ["Подкат/скольжение", "свайп вниз по земле"],
    ["Монетка", "+1 очко"],
    ["Алмаз", "+10 очков"],
    ["Уровень", "2000 м, всего 10"],
    ["Медаль", "за каждый уровень"],
    ["Пауза", "кнопка ⏸ или ESC"],
  ];
  const x0 = 42;

  for (const [k, v] of lines) {
    ctx.font = "bold 21px sans-serif";

}

function drawPause(pal) {
  ctx.fillStyle = "rgba(5,6,15,0.82)";
  ctx.fillRect(-20, -20, W + 40, H + 40);
  text("ПАУЗА", W / 2, 150, 46, pal.neon, "center", true);

}

function drawDead(pal) {
  ctx.fillStyle = "rgba(5,6,15,0.6)";
  ctx.fillRect(-20, -20, W + 40, H + 40);
  const m = Math.floor(dist / PX_PER_M);
  if (newRecord) {
    const a = 0.7 + 0.3 * Math.sin(bgT * 10);
    ctx.globalAlpha = a;
    text("НОВЫЙ РЕКОРД!", W / 2, 250, 44, "#ffd21e", "center", true);
    ctx.globalAlpha = 1;
  } else {
    text("ПРОВАЛ", W / 2, 250, 48, pal.neon, "center", true);
  }
  text(m + " м", W / 2, 322, 56, "#fff", "center", true);
  text("рекорд: " + best + " м", W / 2, 362, 20, "rgba(255,255,255,0.7)", "center");
  coinRowCentered(W / 2, 394, 22, coins, "rgba(255,255,255,0.85)", true);
  if (boardRank > 0) {
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(bgT * 8);
    text("🏅 место в лидерах: " + boardRank, W / 2, 428, 20, "#ffd21e", "center", true);
    ctx.globalAlpha = 1;
  }
  // medal collection grid (one medal per level)
  drawMedals(486);
  if (medalFlash > 0) {
    ctx.globalAlpha = Math.min(1, medalFlash);
    text("🏆 " + medalFlashText + "!", W / 2, 618, 24, "#ffd700", "center", true);
    ctx.globalAlpha = 1;
  }
  if (deadAt > 0.4) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(bgT * 4);
    text("ТAP — ЕЩЁ РАЗ", W / 2, 668, 30, "#fff", "center", true);
    ctx.globalAlpha = 1;
    text("ESC — в меню", W / 2, 704, 17, "rgba(255,255,255,0.5)");
  }
}

// ---------- main loop ----------
let last = 0, acc = 0;
const STEP = 1 / 60;

function frame(t) {
  requestAnimationFrame(frame);
  if (!last) last = t;
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.25) dt = 0.25;   // tab was hidden
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
  draw();
}

// ---------- boot ----------
reset();
// Download AND decode the first two level tracks straight away, with no user
// gesture: OfflineAudioContext is exempt from the autoplay policy, so the PCM
// is ready before the player ever taps Play. Creating the live AudioBuffer from
// that PCM later is just a memcpy, so the level's music starts on frame one.
Music.bootDecode();
loadAssets(() => {
  document.title = "NEON RUN";
  window.__booted = true;
  requestAnimationFrame(frame);
  // debug hooks for automated tests
  window.__game = {
    get state() { return state; }, get dist() { return dist; }, get best() { return best; },
    get obstacles() { return obstacles; }, get player() { return player; },
    get coins() { return coinsArr; },
    get assets() { return { loaded: Object.keys(SPR).length, failed: assetsFailed }; },
    get theme() { return theme(); }, get pose() { return window.__lastPose; },
    get pal() { return palette(); }, get hpal() { return hazardPalette(); },
    get level() { return levelIdx(); }, get speed() { return speed; },
    get GY() { return GY; },
    get rosters() { return LEVEL_ENEMIES; },
    get obs() { return OBS; },
    get sprites() { return Object.keys(SPR); },
    spawnObstacle,
    get banner() { return { t: levelBannerT, txt: levelBannerTxt }; },
    get mood() { return mood; },
    get strideLen() { return player.strideLen || (80 + speed * 0.28); },
    coinSprite,
    gemSprite,
    get coinSkin() { return coinSprite(); },
    get gemSkin() { return gemSprite(); },
    get poseAngles() { return window.__pose; },
    get boardRank() { return boardRank; },
    get music() { return {
      on: Music.on, track: Music.track,
      useFiles: Music.useFiles,
      playing: !!Music.current,
      ready: Music.ready(Music.track < 0 ? 0 : Music.track),
      fileReady: Music.FILES.map(n => Music.bufCache[n] ? 1 : (Music.bufCache[n] === false ? -1 : 0)),
      pcmReady: Music.FILES.map(n => {
        const v = Music.pcmCache[n];
        return v && typeof v === "object" && v.ch ? 1 : (v === false ? -1 : 0);
      }),
    }; },
    get startPending() { return startPending; },
    // screen-space rect of the runner, for screenshot verification
    get playerScreen() {
      const c = document.getElementById("c");
      const r = c.getBoundingClientRect();
      return { x: r.left + (offX + player.x * scale) / dpr,
               y: r.top + (offY + (player.y - 112) * scale) / dpr,
               w: (80 * scale) / dpr, h: (120 * scale) / dpr };
    },
    // screen-space rects of the hazards (for screenshot verification)
    get obstacleRects() {
      const c = document.getElementById("c");
      const r = c.getBoundingClientRect();
      return obstacles.map(ob => ({
        name: ob.name,
        x: r.left + (offX + ob.x * scale) / dpr,
        y: r.top + (offY + (ob.y - ob.def.h) * scale) / dpr,
        w: (ob.def.w * scale) / dpr,
        h: (ob.def.h * scale) / dpr,
      }));
    },
    start: startGame, die,
    // navigation hooks (Android back button / shell wrappers)
    pause: pauseGame, resume: resumeGame, openMenu, toMenu,
    get menuPage() { return menuPage; },
    get buttons() { return menuButtons().map(b => ({ id: b.id, label: b.label, x: b.x, y: b.y, w: b.w, h: b.h })); },
    pressButton: (id) => runMenuButton(id),
    // teleport cleanly: clear the field, place the runner on the ground, sync the level
    setDist: (d) => { dist = d; obstacles.length = 0; coinsArr.length = 0; spawnAt = dist + 700;
                      player.y = GY; player.vy = 0; player.onGround = true; player.dead = false;
                      startPending = false;
                      shownLevel = levelIdx(); state = ST.PLAY; Music.setTrack(levelIdx()); },
    clear: () => { obstacles.length = 0; coinsArr.length = 0; spawnAt = dist + 900; },
    spawn: (name, x) => spawnObstacle(name, x === undefined ? W + 60 : x),
  };
});
</script>
