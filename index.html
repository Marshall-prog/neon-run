<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Неон Бег — Neon Run</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060f; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="hero.js"></script>
<script>
"use strict";
/* ============================================================
   NEON RUN — endless runner
   Vanilla JS + Canvas. Assets: Kenney "Platformer Pack Remastered" +
   "Platformer Characters" (both CC0).
   ============================================================ */

// ---------- constants (logical resolution) ----------
const W = 480, H = 800;      // logical portrait screen
const GY = 660;              // ground line (y of ground surface)
const GRAVITY = 2800;
const JUMP_V = -1080;
const DJUMP_V = -950;
const SPEED0 = 300, SPEED_MAX = 900;
// gradually flattening speed curve: fast early growth that eases off over the run
const SPEED_SQRT = 4.6;
const PX_PER_M = 10;         // score meters
const DIFF_LEN = 2000;       // metres of one difficulty level
const DIFF_MAX = 9;          // 10 levels: index 0..9
const N_LEVELS = 10;

// one medal per level: reaching the end of level N earns medal N
const MEDALS = Array.from({ length: N_LEVELS }, (_, i) => (i + 1) * DIFF_LEN);

// one palette per difficulty level (index matches levelIdx)
const PALETTES = [
  { neon: "#00fff0", dim: "#0a3a3f", glow: "#00c8d6" },   // 1 горизонт
  { neon: "#ff2bd6", dim: "#3f0a34", glow: "#d61eb0" },   // 2 город
  { neon: "#b967ff", dim: "#2d1045", glow: "#9a4fe0" },   // 3 луна
  { neon: "#2bd6ff", dim: "#0a2d3f", glow: "#1eb0d6" },   // 4 синтвейв
  { neon: "#7cff5a", dim: "#123f0a", glow: "#5fd647" },   // 5 лес
  { neon: "#8fe9ff", dim: "#0b2a3a", glow: "#5fc8e8" },   // 6 ледяной каньон
  { neon: "#ff7a1a", dim: "#3f1405", glow: "#e85a10" },   // 7 вулкан
  { neon: "#ffd24a", dim: "#3d2e08", glow: "#e0a91e" },   // 8 пустыня
  { neon: "#ff4d6d", dim: "#2a0713", glow: "#d61e46" },   // 9 подземелье
  { neon: "#e8ff3a", dim: "#1a2a06", glow: "#b6d61e" },   // 10 цифровое ядро
];

// ---------- difficulty levels: one permanent backdrop per level (no cycling) ----------
const THEMES = ["horizon", "city", "moon", "grid", "forest",
                "ice", "volcano", "desert", "cave", "core"];
const LEVEL_NAMES = [
  "НЕОНОВЫЙ ГОРИЗОНТ", "ЗАКАТНЫЙ ГОРОД", "ЛУННЫЕ ГОРЫ", "СИНТВЕЙВ", "НЕОНОВЫЙ ЛЕС",
  "ЛЕДЯНОЙ КАНЬОН", "ВУЛКАН", "НЕОНОВАЯ ПУСТЫНЯ", "ПОДЗЕМЕЛЬЕ", "ЦИФРОВОЕ ЯДРО",
];
function levelIdx() { return Math.min(DIFF_MAX, Math.floor(Math.max(0, dist) / (PX_PER_M * DIFF_LEN))); }
function theme() { return THEMES[levelIdx()]; }
// One collectible everywhere: COINS. No stars — the player always collects
// coins for score, and occasionally a rarer GEM appears (worth more).
// Each level has its own coin colour (gold/silver/bronze) for flavour.
const COIN_SKIN = [
  "coin", "coin", "coin", "coin", "coin",
  "coin_silver", "coin_silver", "coin_bronze", "coin_bronze", "coin",
];
function coinSprite() { return COIN_SKIN[levelIdx()] || "coin"; }
// the occasional bonus pickup is a gem; its colour follows the level tint
const GEM_SKIN = [
  "gem", "gem_green", "gem", "gem_green", "gem_green",
  "gem", "gem_red", "gem_yellow", "gem_red", "gem_yellow",
];
function gemSprite() { return GEM_SKIN[levelIdx()] || "gem"; }
let shownLevel = -1;   // for the "new level" banner
let levelBannerT = 0;  // banner timer
let levelBannerTxt = "";

// ---------- canvas ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  const nw = Math.round(cw * dpr), nh = Math.round(ch * dpr);
  // Changing canvas.width/height clears (blacks out) the canvas until the next
  // paint. On a phone the address bar collapses mid-run and fires resize without
  // any real size change, which used to flash black. Only touch the backing
  // store when the size actually differs, and repaint at once when it does.
  if (canvas.width === nw && canvas.height === nh &&
      canvas.style.width === cw + "px" && canvas.style.height === ch + "px") return;
  canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
  canvas.width = nw; canvas.height = nh;
  scale = Math.min(canvas.width / W, canvas.height / H);
  offX = (canvas.width - W * scale) / 2;
  offY = (canvas.height - H * scale) / 2;
  if (typeof draw === "function" && window.__booted) draw();   // repaint: no black gap
}
window.addEventListener("resize", resize);
resize();

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("neonrun_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("neonrun_" + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- audio (synth) ----------
function vibrate(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

const Sound = {
  ctx: null, muted: store.get("muted", false),
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  blip(f0, f1, dur, type, vol) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = buf; g.gain.value = vol || 0.14;
    s.connect(g).connect(this.ctx.destination); s.start(t);
  },
  jump()  { this.blip(300, 620, 0.12, "square", 0.024); },
  djump() { this.blip(500, 950, 0.12, "square", 0.024); },
  duck()  { this.noise(0.08, 0.018); },
  coin()  { this.blip(900, 1400, 0.09, "sine", 0.035); this.blip(1300, 1800, 0.12, "sine", 0.018); },
  gem()   { this.blip(700, 1600, 0.25, "triangle", 0.038); },
  hit()   { this.noise(0.25, 0.06); this.blip(220, 40, 0.35, "sawtooth", 0.038); },
  thud()  { this.noise(0.16, 0.05); this.blip(90, 55, 0.18, "sine", 0.03); },
  record(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, f, 0.15, "square", 0.028), i * 110)); },
  ui()    { this.blip(600, 800, 0.06, "square", 0.02); },
  medal() { [660, 880, 1100].forEach((f, i) => setTimeout(() => this.blip(f, f, 0.12, "triangle", 0.028), i * 90)); },
  toggle() { this.muted = !this.muted; store.set("muted", this.muted); },
};

// ---------- music ----------
// One looping background track per difficulty level, shipped as compact CC0
// Opus files (assets/music/lvlNN.opus). If a file is missing or cannot be
// decoded, the game falls back to a small procedural step sequencer (bass +
// arpeggio + hats) built in Web Audio, so music never goes silent.
// Track credits / licences are in assets/music/CREDITS.txt. Muted independently of SFX.
const Music = {
  ctx: null, on: store.get("music", true), track: -1, timer: null,
  step: 0, nextTime: 0, master: null, gainNode: null,
  fileGain: null,          // gain node for the file-based tracks
  bufCache: {},            // level -> AudioBuffer (decoded Opus, live context)
  pcmCache: {},            // level -> {ch, len, sr} raw PCM decoded without a gesture
  promoting: {},           // name -> in-flight chunked PCM copy into the live ctx
  bytesCache: {},          // level -> ArrayBuffer (raw file, fetched before any gesture)
  current: null,           // currently playing looping BufferSource
  useFiles: false,         // true once at least one level file decoded

  // File-based background music: one CC0 track per level (see CREDITS below).
  // If a file fails to load we fall back to the procedural music for that level.
  FILES: ["lvl01","lvl02","lvl03","lvl04","lvl05","lvl06","lvl07","lvl08","lvl09","lvl10"],

  // per-level: tempo (bpm), root (Hz), scale degrees, hat density
  TRACKS: [
    { bpm: 92,  root: 110.00, scale: [0, 3, 5, 7, 10], kick: 2, hat: 2, wave: "triangle", name: "Горизонт" },
    { bpm: 100, root: 123.47, scale: [0, 2, 3, 7, 8],  kick: 2, hat: 2, wave: "square",   name: "Город" },
    { bpm: 108, root: 130.81, scale: [0, 2, 5, 7, 9],  kick: 4, hat: 4, wave: "sawtooth", name: "Луна" },
    { bpm: 118, root: 146.83, scale: [0, 1, 5, 7, 8],  kick: 4, hat: 4, wave: "square",   name: "Синтвейв" },
    { bpm: 126, root: 164.81, scale: [0, 2, 3, 6, 10], kick: 8, hat: 8, wave: "sawtooth", name: "Лес" },
    { bpm: 112, root: 155.56, scale: [0, 3, 7, 10, 12], kick: 4, hat: 4, wave: "triangle", name: "Каньон" },
    { bpm: 138, root: 98.00,  scale: [0, 1, 4, 6, 8],  kick: 8, hat: 8, wave: "sawtooth", name: "Вулкан" },
    { bpm: 104, root: 174.61, scale: [0, 2, 5, 9, 10], kick: 4, hat: 4, wave: "triangle", name: "Пустыня" },
    { bpm: 130, root: 87.31,  scale: [0, 3, 5, 6, 10], kick: 8, hat: 4, wave: "square",   name: "Подземелье" },
    { bpm: 150, root: 196.00, scale: [0, 2, 4, 7, 11], kick: 8, hat: 8, wave: "sawtooth", name: "Ядро" },
  ],

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.52;      // чуть громче общая музыка
    this.master.connect(this.ctx.destination);
    this.fileGain = this.ctx.createGain();
    this.fileGain.gain.value = 1.0;     // треки и так замастед, подкрутили выше
    this.fileGain.connect(this.master);
    this.preload();
  },
  // Decode level tracks lazily, one at a time. Decoding all ten Opus files at
  // once used to stall the first seconds of a run (the main thread had to
  // decode ~3 MB of audio right as the player started moving). Now we only
  // load the track that is about to play plus a one-level look-ahead, and we
  // queue the work serially so it never competes with gameplay.
  preload() { this._queue = []; this._loading = false; this._warm(); },
  // Start downloading the raw Opus bytes at page load, long before the first
  // user gesture creates the AudioContext. Network latency then stays off the
  // critical path: when the player taps Play only decodeAudioData() is left, so
  // the level's music begins together with the run instead of late.
  prefetch(i) {
    const name = this.FILES[i];
    if (!name || this.bytesCache[name] !== undefined) return this.bytesCache[name];
    const p = fetch("assets/music/" + name + ".opus")
      .then(r => { if (!r.ok) throw new Error(); return r.arrayBuffer(); })
      .then(b => { this.bytesCache[name] = b; return b; })
      .catch(() => { this.bytesCache[name] = false; return false; });
    this.bytesCache[name] = p;      // store the promise while in flight
    return p;
  },
  // Decode a track WITHOUT waiting for a user gesture. OfflineAudioContext is
  // not subject to the autoplay policy (it never plays to the speakers), so we
  // can decode the first tracks while the player is still looking at the menu.
  // The result is raw PCM; turning it into a live AudioBuffer later is a cheap
  // memcpy, so playback can begin on the very first frame of the run.
  decodeOffline(i) {
    if (typeof OfflineAudioContext === "undefined" && typeof webkitOfflineAudioContext === "undefined") {
      return Promise.reject(new Error("no offline ctx"));
    }
    const name = this.FILES[i];
    if (!name) return Promise.reject(new Error("bad index"));
    if (this.pcmCache[name] !== undefined) return this.pcmCache[name];
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const p = this.prefetch(i)
      .then(bytes => {
        if (!bytes) throw new Error("no bytes");
        const oac = new OAC(2, 44100, 44100);
        return oac.decodeAudioData(bytes.slice(0));
      })
      .then(buf => {
        const chs = [];
        for (let c = 0; c < buf.numberOfChannels; c++) chs.push(buf.getChannelData(c).slice());
        const pcm = { ch: chs, len: buf.length, sr: buf.sampleRate };
        this.pcmCache[name] = pcm;
        // if the live context already exists, upgrade to a playable buffer
        this._promote(name, i, pcm);
        return pcm;
      })
      .catch(err => { this.pcmCache[name] = false; throw err; });
    this.pcmCache[name] = p;        // promise while in flight
    return p;
  },
  // Build a live AudioBuffer from decoded PCM. A full track is ~26 ms of
  // copying (2 ch × ~100 s), which is a visible hitch if done in one frame, so
  // the copy is chunked across animation frames. `_promoting[name]` holds the
  // in-progress state; the buffer only enters `bufCache` when it is complete.
  _bufferFromPCM(pcm) {
    const buf = this.ctx.createBuffer(pcm.ch.length, pcm.len, pcm.sr);
    for (let c = 0; c < pcm.ch.length; c++) buf.copyToChannel(pcm.ch[c], c);
    return buf;
  },
  // copy PCM into the live context in slices, one slice per animation frame
  _bufferFromPCMChunked(name, pcm, onDone) {
    if (this.promoting[name]) return;          // already copying
    const buf = this.ctx.createBuffer(pcm.ch.length, pcm.len, pcm.sr);
    const st = { buf, ch: 0, off: 0 };
    this.promoting[name] = st;
    const CHUNK = 1 << 20;                        // ~1M frames per slice
    const step = () => {
      const t0 = performance.now();
      while (st.ch < pcm.ch.length && performance.now() - t0 < 5) {
        const src = pcm.ch[st.ch];
        const end = Math.min(st.off + CHUNK, pcm.len);
        buf.copyToChannel(src.subarray(st.off, end), st.ch, st.off);
        st.off = end;
        if (st.off >= pcm.len) { st.ch++; st.off = 0; }
      }
      if (st.ch >= pcm.ch.length) {
        delete this.promoting[name];
        this.bufCache[name] = buf;
        this.useFiles = true;
        if (onDone) onDone(buf);
      } else {
        requestAnimationFrame(step);
      }
    };
    step();
  },
  // when both the live context and the PCM exist, make the track playable
  _promote(name, i, pcm, onDone) {
    if (!this.ctx || this.bufCache[name] || this.promoting[name]) return;
    this._bufferFromPCMChunked(name, pcm, onDone);
  },
  // decode the first tracks at page load, with no gesture required
  bootDecode() {
    this.decodeOffline(0).catch(() => {});
    this.decodeOffline(1).catch(() => {});
  },
  // warm the current level and the next one, in the background
  _warm() {
    const cur = levelIdx();
    this.want(cur);
    this.want(cur + 1);
  },
  want(i) {
    if (i < 0 || i >= this.FILES.length) return;
    const name = this.FILES[i];
    if (this.bufCache[name] !== undefined) return;   // cached, loading or failed
    if (this._queue.indexOf(i) >= 0) return;
    this._queue.push(i);
    this._drain();
  },
  _drain() {
    if (this._loading || !this._queue.length || !this.ctx) return;
    const i = this._queue.shift();
    const name = this.FILES[i];
    this._loading = true;
    this.bufCache[name] = null;        // mark as "loading"
    // Already decoded ahead of time without a gesture? Building the live buffer
    // is then an instant copy, with no decodeAudioData() cost on this thread.
    // The current track is copied right away (it must start with the level);
    // a look-ahead track is copied on a later idle tick so the memcpy never
    // lands on the frame that starts the run.
    const pcm = this.pcmCache[name];
    if (pcm && pcm !== true && typeof pcm === "object" && pcm.ch) {
      if (this.track === i) {
        this._promote(name, i, pcm, () => { if (this.track === i) this._playFile(i); });
        this._loading = false;
        this._drain();
      } else {
        this._deferPromote(name, i, pcm);
      }
      return;
    }
    // reuse the bytes already fetched during page load when possible
    let bytes = this.bytesCache[name];
    let getBytes;
    if (bytes === false) getBytes = Promise.reject(new Error());
    else if (bytes) getBytes = Promise.resolve(bytes);
    else getBytes = this.prefetch(i);
    getBytes
      .then(b => new Promise((res, rej) => this.ctx.decodeAudioData(b.slice(0), res, rej)))
      .then(buf => {
        this.bufCache[name] = buf; this.useFiles = true;
        if (this.track === i) this._playFile(i);
      })
      .catch(() => {
        this.bufCache[name] = false;               // false = unavailable
        if (this.track === i) this._startProc(i);  // keep music alive via synth
      })
      .then(() => { this._loading = false; this._drain(); });
  },
  // Copy a look-ahead track's PCM into the live context on an idle callback, so
  // the (chunked) memcpy never competes with a running frame.
  _deferPromote(name, i, pcm) {
    const run = () => {
      this.bufCache[name] = undefined;      // let _promote claim the slot
      this._promote(name, i, pcm);
      this._loading = false;
      this._drain();
    };
    if (typeof requestIdleCallback === "function") requestIdleCallback(run, { timeout: 400 });
    else setTimeout(run, 0);
  },
  _stopFile() {
    if (this.current) {
      try { this.current.onended = null; this.current.stop(); } catch (e) {}
      this.current = null;
    }
  },
  _playFile(i) {
    if (!this.ctx || !this.on) return;
    const buf = this.bufCache[this.FILES[i]];
    if (!buf) return;                    // not decoded yet / unavailable
    this._stopFile();
    this._stopProc();
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(this.fileGain);
    src.start();
    this.current = src;
  },
  _stopProc() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  // one note (frequency, duration, type, when, gain)
  note(f, dur, type, when, vol, detune) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, when);
    if (detune) o.detune.setValueAtTime(detune, when);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol || 0.1, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(this.master);
    o.start(when); o.stop(when + dur + 0.02);
  },
  kick(when) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(140, when);
    o.frequency.exponentialRampToValueAtTime(44, when + 0.11);
    g.gain.setValueAtTime(0.5, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    o.connect(g).connect(this.master);
    o.start(when); o.stop(when + 0.18);
  },
  hat(when) {
    if (!this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate * 0.03);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain(), hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 6000;
    g.gain.value = 0.06;
    s.buffer = buf; s.connect(hp).connect(g).connect(this.master); s.start(when);
  },
  semi(root, s) { return root * Math.pow(2, s / 12); },

  // schedule ~200ms of music ahead of the audio clock
  pump() {
    if (!this.ctx || !this.on || this.track < 0) return;
    const T = this.TRACKS[this.track];
    const spb = 60 / T.bpm;                 // seconds per beat
    const sixteenth = spb / 4;
    const now = this.ctx.currentTime;
    while (this.nextTime < now + 0.2) {
      const s = this.step % 16;
      const t = this.nextTime;
      // bass on the downbeats
      if (s % 4 === 0) {
        const deg = T.scale[(Math.floor(s / 4) + this.track) % T.scale.length];
        this.note(this.semi(T.root, deg) / 2, sixteenth * 2.2, "triangle", t, 0.20);
      }
      // arpeggio on every other 16th
      if (s % 2 === 0) {
        const deg = T.scale[(s + this.step * 3) % T.scale.length];
        this.note(this.semi(T.root, deg) * 2, sixteenth * 1.4, T.wave, t, 0.075);
      }
      // drums
      if (s % (16 / T.kick) === 0) this.kick(t);
      if (s % (16 / T.hat) === 0) this.hat(t);
      this.nextTime += sixteenth;
      this.step++;
    }
  },
  setTrack(i) {
    if (!this.on) { this.track = i; return; }
    if (this.track === i) return;
    this.track = i;
    this.resume();
    if (!this.ctx) return;
    const name = this.FILES[i];
    let buf = this.bufCache[name];
    // A track decoded ahead of time (OfflineAudioContext, no gesture) only needs
    // a chunked memcpy to become playable. Kick that off now; playback starts on
    // the callback so the music begins the moment the copy finishes, and no
    // single frame ever carries the whole copy.
    if (!buf && this.pcmCache[name] && this.pcmCache[name].ch) {
      this._promote(name, i, this.pcmCache[name], () => {
        if (this.track === i) this._playFile(i);
      });
      if (this.promoting[name]) { this._warm(); return; }   // copy in progress
      buf = this.bufCache[name];
    }
    if (buf) { this._playFile(i); this._warm(); return; }   // file ready -> use it
    if (buf === false) { this._startProc(i); return; }      // file missing -> procedural
    // Still loading (null): request it and wait. We deliberately do NOT start
    // the procedural sequencer here — a short silence while a real track loads
    // is cleaner than synth notes stacking on top of it, and it avoids spinning
    // up oscillators on the exact frames when the browser is busy decoding
    // (which caused a visible hitch at the start of level 1). If the load later
    // fails, the catch handler in _drain falls back to procedural automatically.
    this._stopProc();
    this.want(i);
    this._warm();
  },
  _startProc(i) {
    if (this.track !== i) return;
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.05;
    if (!this.timer) this.timer = setInterval(() => this.pump(), 60);
  },
  // Is level i's music ready to play instantly? "ready" means the buffer is
  // decoded into the live context, or the file was found unavailable (procedural
  // fallback). A track whose PCM is decoded but still being copied into the live
  // context is NOT ready yet — the start gate should wait those few frames so
  // the level begins with its music already playing.
  ready(i) {
    if (!this.on) return true;
    const name = this.FILES[i];
    const buf = this.bufCache[name];
    if (buf || buf === false) return true;
    return false;      // loading, or PCM copy still in progress
  },
  stop() { this.track = -1; this._stopProc(); this._stopFile(); },
  setEnabled(on) {
    this.on = on; store.set("music", on);
    this.resume();
    if (!on) this.stop();
    else if (state === ST.PLAY) { this.track = -1; this.setTrack(levelIdx()); }
  },
};

function makeBuildings(seed, count, minW, maxW, minH, maxH, span) {
  // deterministic skyline covering [0, span)
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const list = [];
  let x = 0;
  for (let i = 0; i < count; i++) {
    const w = minW + Math.floor(rnd() * (maxW - minW));
    const h = minH + Math.floor(rnd() * (maxH - minH));
    list.push({ x, w, h, seed: Math.floor(rnd() * 1e9) });
    x += w + 8 + Math.floor(rnd() * 30);
    if (x > span) break;
  }
  return { list, span };
}
function makeTrees(seed, count, minH, maxH, span) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const list = [];
  let x = 0;
  for (let i = 0; i < count; i++) {
    const h = minH + Math.floor(rnd() * (maxH - minH));
    const w = h * (0.55 + rnd() * 0.3);
    list.push({ x, w, h });
    x += w * 0.5 + 6 + Math.floor(rnd() * 26);
    if (x > span) break;
  }
  return { list, span };
}
function makeGems(seed, count, span) {

  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const list = [];
  let x = 0;
  for (let i = 0; i < count; i++) {
    const h = 30 + Math.floor(rnd() * 110);
    const w = h * (0.3 + rnd() * 0.25);
    list.push({ x, w, h, lean: (rnd() - 0.5) * 0.5 });
    x += w + 24 + Math.floor(rnd() * 70);
    if (x > span) break;
  }
  return { list, span };
}

const Board = {
  KEY: "scores",
  load() { const v = store.get(this.KEY, []); return Array.isArray(v) ? v : []; },
  save(list) { store.set(this.KEY, list.slice(0, 5)); },
  // returns the 1-based rank if it made the board, else 0
  add(meters, coins, level) {
    const entry = { m: meters, c: coins, lv: level + 1, d: Date.now() };
    const list = this.load();
    list.push(entry);
    list.sort((a, b) => (b.m - a.m) || (b.c - a.c) || (a.d - b.d));
    const top = list.slice(0, 5);
    let rank = 0;
    for (let i = 0; i < top.length; i++) {
      if (top[i] === entry || (top[i].d === entry.d && top[i].m === entry.m && top[i].c === entry.c)) {
        rank = i + 1;
        break;
      }
    }
    this.save(top);
    return rank;
  },

  // backend exists and `load()` can merge remote + local entries.

// ---------- menu buttons ----------
// Button block, vertically centred in the play area. The block's height is
// The whole menu block (logo + hero + buttons) is measured first and then
// centred as one unit between the top padding and the footer hint, so it stays
// balanced on short desktop windows as well as tall phones.
const BTN_W = 300, BTN_H = 60, BTN_GAP = 12;
const TITLE_BOTTOM = 300;               // logical y where the logo/hero block ends

function menuButtons() {
  const list = [];
  const bw = BTN_W, bh = BTN_H, gap = BTN_GAP, cx = W / 2;

  // describe the rows first, then lay them out centred
  const rows = [];
  if (menuPage === "pause") {
    rows.push([["resume", "ПРОДОЛЖИТЬ"]]);
    rows.push([["sfx", Sound.muted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ", bw / 2 - 6],
               ["mus", Music.on ? "МУЗЫКА: ВКЛ" : "МУЗЫКА: ВЫКЛ", bw / 2 - 6]]);
    rows.push([["menu", "В ГЛАВНОЕ МЕНЮ"]]);
  } else if (menuPage === "main") {
    rows.push([["start", "СТАРТ"]]);
    rows.push([["board", "ТАБЛИЦА ЛИДЕРОВ"]]);
    rows.push([["howto", "КАК ИГРАТЬ"]]);
    rows.push([["sfx", Sound.muted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ", bw / 2 - 6],
               ["mus", Music.on ? "МУЗЫКА: ВКЛ" : "МУЗЫКА: ВЫКЛ", bw / 2 - 6]]);
    rows.push([["exit", "ВЫХОД"]]);
  } else {
    rows.push([["back", "НАЗАД"]]);
  }

  const totalH = rows.length * bh + (rows.length - 1) * gap;
  // For the info pages the text owns the middle of the screen, so the single
  // BACK button is pinned to the bottom instead of centred over the text.
  const infoPage = (menuPage === "howto" || menuPage === "board");
  const areaTop = infoPage ? (H - 40 - bh) : TITLE_BOTTOM;
  const areaBottom = H - 40;
  let y = infoPage ? areaTop : areaTop + Math.max(0, (areaBottom - areaTop - totalH) / 2);

  for (const row of rows) {
    const rowW = row.reduce((s, r) => s + (r[2] || bw), 0) + (row.length - 1) * gap;
    let x = cx - rowW / 2;
    for (const [id, label, w] of row) {
      const bwid = w || bw;
      list.push({ id, label, x, y, w: bwid, h: bh });
      x += bwid + gap;
    }
    y += bh + gap;
  }
  return list;
}

function buttonAt(x, y) {
  for (const b of menuButtons()) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

function runMenuButton(id) {
  switch (id) {

    case "board": menuPage = "board"; Sound.ui(); break;

function tryJump() {
  if (startPending) return;   // Play tapped, waiting for music: ignore input
  if (state === ST.MENU) { if (menuPage === "main") startGame(); else menuPage = "main"; return; }
  if (state === ST.DEAD) { if (deadAt > 0.4) startGame(); return; }
  if (state === ST.PAUSE) { resumeGame(); return; }
  if (player.dead) return;
  player.buffer = 0.13;   // jump buffering — feels responsive
}

function doJump() {
  if (player.onGround || player.coyote > 0) {
    player.vy = JUMP_V; player.onGround = false; player.coyote = 0; player.jumps = 1;
    player.ducking = false; slideT = 0; Sound.jump(); spawnPuff(player.x, GY, 6);
  } else if (player.jumps < 2) {
    player.vy = DJUMP_V; player.jumps = 2; player.ducking = false; slideT = 0;
    Sound.djump(); spawnPuff(player.x, player.y, 8);
  }
}

// vibration on double jump (called from user gesture handlers)
function vibrateDoubleJump() { try { if (navigator.vibrate) navigator.vibrate([10, 20, 10]); } catch(e){} }

function setDuck(on) {
  if (state !== ST.PLAY || player.dead) return;
  if (on && !player.ducking) {
    Sound.duck();
    if (player.onGround) {
      slideT = 0.68;
      try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
      player.ducking = true;
    } else {
      // air duck = fast fall only, no slide state
      player.vy += 420;
    }
  } else if (!on) {
    player.ducking = false;
  }
}

// touch / mouse
canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault(); Sound.unlock(); Music.resume();
  anyPointerDown = true;
  const p = logicalXY(e);
  // menu screens: taps go to buttons, not to the game
  if (state === ST.MENU) {
    if (startPending) return;              // waiting for music: swallow taps
    const b = buttonAt(p.x, p.y);
    if (b) runMenuButton(b.id);
    return;
  }
  // paused: the same panel system handles the taps
  if (state === ST.PAUSE) {
    const b = buttonAt(p.x, p.y);
    if (b) runMenuButton(b.id);
    return;
  }
  // pause button (top-right) opens the menu — on phones it's the way back
  if (state === ST.PLAY && p.x > W - 70 && p.y < 80) { openMenu(); return; }
  if (state === ST.PLAY) {
    pointerStartY = p.y; pointerDucked = false;
    pendingJumpT = performance.now();   // deferred: jump only if not a swipe-down/up
  } else {
    tryJump();
  }
}, { passive: false });

canvas.addEventListener("pointermove", (e) => {
  if (state === ST.MENU) {
    const hp = logicalXY(e);
    const hb = buttonAt(hp.x, hp.y);
    hoverId = hb ? hb.id : null;
    canvas.style.cursor = hb ? "pointer" : "default";
    return;
  }
  if (pointerStartY === null) return;
  const p = logicalXY(e);
  const dy = p.y - pointerStartY;
  if (pendingJumpT !== null && dy > 16) {
    // gesture is a swipe-down: cancel the pending jump, slide/duck instead
    pendingJumpT = null;
    setDuck(true); pointerDucked = true;
    try { if (navigator.vibrate) navigator.vibrate(14); } catch(ex){}
    return;
  }
  if (pendingJumpT !== null && dy < -16) {
    // swipe-up = jump right now (feels instant)
    pendingJumpT = null; tryJump(); vibrateDoubleJump();
    return;
  }
});

function pointerUp() {
  anyPointerDown = false; pointerStartY = null; pointerDucked = false;
  if (pendingJumpT !== null) {
    const wasInAir = !player.onGround && player.coyote <= 0 && player.jumps > 0;
    pendingJumpT = null; tryJump();
    if (wasInAir && player.jumps === 2) vibrateDoubleJump();
  }
  // slide has its own fixed timer, don't interfere
}

      else if (state === ST.MENU && menuPage !== "main") menuPage = "main";
      break;
    case "KeyM": if (state === ST.MENU) { Music.resume(); Music.setEnabled(!Music.on); } else Sound.toggle(); break;
    case "KeyB": if (state === ST.MENU) { menuPage = menuPage === "board" ? "main" : "board"; Sound.ui(); } break;
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowDown" || e.code === "KeyS") setDuck(false);
});

// ---------- state transitions ----------
// Tapping Play opens a very short gate: we do not move the runner until the
// first level's music is decoded (or known-unavailable), so the track starts
// together with the level and any decode hitch happens before the run.
function startGame() {
  reset(); Sound.ui();
  Music.resume();
  startPending = true; startWaitT = 0;
  Music.setTrack(levelIdx());
}
// called from update(): close the gate as soon as the music is ready
function tickStartGate(dt) {
  if (!startPending) return;
  startWaitT += dt;
  if (Music.ready(levelIdx()) || startWaitT >= START_GATE_MAX) {
    startPending = false;
    state = ST.PLAY;
    Music.setTrack(levelIdx());
  }
}
function pauseGame() { if (state === ST.PLAY) { state = ST.PAUSE; Sound.ui(); Music.stop(); } }
function resumeGame() { if (state === ST.PAUSE) { state = ST.PLAY; Sound.ui(); Music.setTrack(levelIdx()); } }
// the in-game "menu": pause the run and show the button panel (continue, menu,
// sound, music). Reached from the ⏸ button on any device and from ESC on desktop.
function openMenu() { if (state === ST.PLAY) { pauseGame(); menuPage = "pause"; } }
function toMenu() { reset(); state = ST.MENU; menuPage = "main"; Sound.ui(); Music.stop(); }

function die() {
  if (player.dead) return;
  if (window.__godMode) return;          // test hook: observe a run without dying
  player.dead = true; player.deadT = 0; state = ST.DEAD; deadAt = 0;
  mood = "sad"; moodT = 0;                 // character looks dejected
  Sound.hit(); shake = 14; hitStop = 0.09; flash = 0.5;
  try { if (navigator.vibrate) navigator.vibrate([40, 30, 60]); } catch(e){}
  spawnBurst(player.x, player.y - 30, 26);
  Music.stop();
  const m = Math.floor(dist / PX_PER_M);
  // record the run in the local leaderboard (rank 1..5, or 0 if it missed)
  boardRank = Board.add(m, coins, levelIdx());
  Board.submitRemote(m, coins);
  if (m > best) {
    best = m; store.set("best", best); newRecord = true; recordFlash = 2.2;
    setTimeout(() => Sound.record(), 350);
  }
  // medals
  let mask = store.get("medals", 0), newMask = mask;
  MEDALS.forEach((t, i) => { if (m >= t) newMask |= (1 << i); });
  if (newMask !== mask) {
    store.set("medals", newMask);
    const gotIdx = MEDALS.findIndex((t, i) => (newMask & (1 << i)) && !(mask & (1 << i)));
    medalFlashText = medalName(gotIdx); medalFlash = 2.5;
    setTimeout(() => Sound.medal(), 900);
  }
  if (firstRun) { firstRun = false; store.set("firstRun", false); }
}

function medalName(i) {
  // one medal per level — named after the level it belongs to
  const base = ["Бронзовая", "Серебряная", "Золотая", "Платиновая", "Изумрудная",
                "Ледяная", "Огненная", "Песчаная", "Кристальная", "ЛЕГЕНДА"][i] || "Медаль";
  return base + (i === 9 ? "" : " медаль");
}

// ---------- spawning ----------
// One hand-picked enemy roster per level, so every level feels different while
// the difficulty still rises gently (later levels add fast movers, spinners and
// airborne hazards). Weights are relative within the level.
// Every level owns a themed hazard set: the props, the critters and the
// machinery all belong to the place you are running through. Weights only
// shuffle the mix inside a level — they never change how often things spawn,
// so adding flavour never makes the game harder.

  [["n_crystal", 12], ["n_cone", 10], ["n_spikes", 8], ["n_orb", 8], ["n_ball", 8],
   ["n_tramp", 7], ["n_arc", 6]],

  [["n_crystal", 12], ["n_spikes", 9], ["n_wall", 9], ["n_arc", 8], ["n_pylon", 7],
   ["n_tramp", 6], ["n_drop", 6]],

  [["n_block", 12], ["n_pylon", 10], ["n_drill", 9], ["n_spikes", 8], ["n_ball", 8],

  [["n_saw", 11], ["n_block", 10], ["n_wall", 9], ["n_drill", 8], ["n_drone", 8],

function pickObstacle() {
  const pool = LEVEL_ENEMIES[levelIdx()] || LEVEL_ENEMIES[0];
  let total = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * total;
  for (const [name, w] of pool) { r -= w; if (r <= 0) return name; }
  return pool[0][0];
}

// ---------- примитивы неоновой графики ----------
function nPath(pts, close) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
    else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  if (close) ctx.closePath();
}
function nDark(a) { ctx.fillStyle = "rgba(5,7,18," + (a === undefined ? 0.92 : a) + ")"; }
function nGlow(col, blur) { ctx.shadowColor = col; ctx.shadowBlur = blur; }

// ---------- неоновые препятствия ----------
// Все препятствия нарисованы процедурно, в том же неоновом языке, что и фон:
// тёмное тело, светящийся контур в цвете уровня, живая деталь. Раньше здесь
// стояли пиксельные спрайты Кенни — из-за них мир читался как коллаж поверх
// неонового фона, а препятствия выглядели одинаковыми.
//
// Формат записи:
//   w, h  — размер рамки препятствия (мировые пиксели)
//   hb    — во сколько раз хитбокс уже рамки (0..1)
//   fly   — высота нижней кромки над землёй (воздушные препятствия)
//   bob   — амплитуда покачивания, move — собственная скорость влево
//   hop   — прыгает по земле, spin — вращается, drop — падает сверху
//   bounce — отскок (трамплин), drill — выдвижной бур, hit — свой хитбокс
const OBS = {
  // ---------------- наземные: перепрыгнуть ----------------

      nPath(hex(r * 0.62), true); ctx.stroke();
